name: Daily packs (crypto + economy)

on:
  schedule:
    # 21:00 UTC == 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test
        run: node --test test/*.test.js

      - name: Build packs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node build_packs.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The run fires at 21:00 UTC, which is already the NEXT day in KST —
          # the day the packs are actually dated. Using `date -u` here labelled
          # every commit with the previous day and made the history look like it
          # had gaps it didn't have.
          PACK_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ -n "$(git status --porcelain packs.json archive)" ]; then
            git add packs.json archive
            git commit -m "chore: daily packs $PACK_DATE (KST)"
            git push
          else
            echo "No changes to the feed"
          fi
