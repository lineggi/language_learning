    /* 오답 노트: grammar SRS built from AI writing corrections            */
    /* ------------------------------------------------------------------ */
    function ErrorNotes({ errors, setErrors, showToast }) {
      const [studying, setStudying] = useState(false);
      const [deck, setDeck] = useState([]);
      const [idx, setIdx] = useState(0);
      const [typed, setTyped] = useState("");
      const [revealed, setRevealed] = useState(false);
      const [known, setKnown] = useState(0);
      const [missed, setMissed] = useState(0);
      const [filter, setFilter] = useState("all");
      // Multiple-choice state: pick the right fix instead of typing blind.
      const [choices, setChoices] = useState(null);   // shuffled [after, ...distractors] or null
      const [selected, setSelected] = useState(null); // chosen option text
      const [mcLoading, setMcLoading] = useState(false);
      const [mcUnavailable, setMcUnavailable] = useState(false); // → falls back to typing

      const list = Object.entries(errors)
        .filter(([, v]) => v && !v.deleted)
        .map(([id, v]) => ({ id, ...v, stage: v.stage || "new" }));
      const counts = { new: 0, review: 0, mastered: 0 };
      list.forEach((e) => { counts[e.stage] = (counts[e.stage] || 0) + 1; });
      const total = list.length;
      const duePool = list.filter((e) => e.stage !== "mastered");
      const filtered = (filter === "all" ? list : list.filter((e) => e.stage === filter))
        .sort((a, b) => (b.addedDate || "").localeCompare(a.addedDate || ""));
      const byCat = {};
      filtered.forEach((e) => { (byCat[e.category || "기타"] = byCat[e.category || "기타"] || []).push(e); });

      const patchError = (id, p) => setErrors((prev) => prev[id] ? ({ ...prev, [id]: { ...prev[id], ...p, updatedAt: Date.now() } }) : prev);
      // Soft delete (tombstone + fresh timestamp) so the removal wins the
      // cross-device merge instead of a stale remote copy bringing it back.
      const removeError = (id) => {
        if (!window.confirm("이 오답을 삭제할까요?")) return;
        setErrors((prev) => (prev[id] ? { ...prev, [id]: { ...prev[id], deleted: true, updatedAt: Date.now() } } : prev));
      };

      const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
      const start = () => {
        if (!duePool.length) return;
        setDeck(shuffle(duePool)); setIdx(0); setTyped(""); setRevealed(false); setKnown(0); setMissed(0); setStudying(true);
      };
      const cur = deck[idx];
      const matched = revealed && cur && normText(typed) === normText(cur.after);

      // Get (or generate) multiple-choice distractors for the current card so
      // reviewing means recognizing the right fix, not guessing blind at what
      // to type. Distractors are cached onto the error entry once generated.
      useEffect(() => {
        if (!studying || !cur) return;
        let cancelled = false;
        setChoices(null); setSelected(null); setMcUnavailable(false); setTyped(""); setRevealed(false);
        (async () => {
          if (Array.isArray(cur.options) && cur.options.length >= 1) {
            if (!cancelled) setChoices(shuffle([cur.after, ...cur.options]));
            return;
          }
          const endpoint = (window.DBW_CONFIG || {}).ERRMC_ENDPOINT;
          if (!endpoint) { if (!cancelled) setMcUnavailable(true); return; }
          setMcLoading(true);
          try {
            const r = await fetch(endpoint, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ before: cur.before, after: cur.after, category: cur.category, why: cur.why }),
            });
            const data = await r.json();
            if (cancelled) return;
            if (r.ok && data && Array.isArray(data.distractors) && data.distractors.length >= 1) {
              patchError(cur.id, { options: data.distractors });
              setChoices(shuffle([cur.after, ...data.distractors]));
            } else setMcUnavailable(true);
          } catch (e) { if (!cancelled) setMcUnavailable(true); }
          if (!cancelled) setMcLoading(false);
        })();
        return () => { cancelled = true; };
      }, [studying, idx]);

      const revealedNow = !!selected || (mcUnavailable && revealed);
      const isCorrectNow = selected ? selected === cur.after : matched;
      const grade = (correct) => {
        const st = (cur.stage || "new");
        if (correct) { patchError(cur.id, { stage: st === "new" ? "review" : "mastered" }); setKnown((k) => k + 1); }
        else { patchError(cur.id, { stage: "new" }); setMissed((m) => m + 1); }
        // 오답노트 review doesn't bump the streak — only memorizing a word does.
        setTyped(""); setRevealed(false); setSelected(null); setChoices(null); setIdx((i) => i + 1);
      };

      const CHIPS = [
        { id: "all", label: `전체 ${total}` },
        { id: "new", label: `복습 필요 ${counts.new || 0}` },
        { id: "review", label: `한 번 맞춤 ${counts.review || 0}` },
        { id: "mastered", label: `완료 ${counts.mastered || 0}` },
      ];

      if (studying) {
        if (idx >= deck.length) {
          return (
            <React.Fragment>
              <div className="studyhead mono">
                <span>오답 복습 완료</span>
                <button className="chip" onClick={() => setStudying(false)}>닫기 ✕</button>
              </div>
              <div className="studydone">
                <div className="donestats">
                  <div className="donestat"><div className="num fraunces">{known}</div><div className="lbl mono">맞은 오답</div></div>
                  <div className="donestat"><div className="num fraunces">{missed}</div><div className="lbl mono">더 볼 오답</div></div>
                </div>
                <button className="btn ghost" onClick={start}>다시 복습</button>
                <button className="btn ghost" onClick={() => setStudying(false)}>오답노트로</button>
              </div>
            </React.Fragment>
          );
        }
        return (
          <React.Fragment>
            <div className="studyhead mono">
              <span>오답 복습 · {idx + 1} / {deck.length}</span>
              <button className="chip" onClick={() => setStudying(false)}>닫기 ✕</button>
            </div>
            <div className="errcard">
              <span className="errcat mono">{cur.category || "기타"}</span>
              <div className="errq mono">틀린 문장</div>
              <div className="errbefore">{cur.before}</div>

              {mcLoading && <div className="mcloading mono">선택지를 만드는 중…</div>}

              {!mcLoading && choices && (
                <React.Fragment>
                  <div className="errask mono">올바르게 고친 표현을 선택하세요</div>
                  <div className="mcchoices">
                    {choices.map((opt, i) => {
                      const isAnswer = opt === cur.after;
                      const cls = "mcopt"
                        + (selected ? (isAnswer ? " correct" : (opt === selected ? " wrong" : "")) : "");
                      return (
                        <button key={i} className={cls} disabled={!!selected} onClick={() => setSelected(opt)}>
                          {opt}
                        </button>
                      );
                    })}
                  </div>
                </React.Fragment>
              )}

              {!mcLoading && !choices && mcUnavailable && (
                <React.Fragment>
                  <div className="errask mono">올바르게 고쳐 써 보세요</div>
                  <textarea className="errinput" value={typed} placeholder="여기에 영어로…"
                    onChange={(e) => setTyped(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!revealed) setRevealed(true); } }} />
                  {!revealed && <button className="btn primary" onClick={() => setRevealed(true)}>확인</button>}
                </React.Fragment>
              )}

              {revealedNow && (
                <React.Fragment>
                  <div className={"errverdict " + (isCorrectNow ? "good" : "bad")}>
                    {isCorrectNow ? "정답이에요 ✓" : "정답과 달라요"}
                  </div>
                  <div className="errafter"><span className="mono">정답</span> {cur.after}</div>
                  {cur.why && <div className="errwhy">{cur.why}</div>}
                  <div className="errbtns">
                    <button className="btn ghost" onClick={() => grade(false)}>더 볼래요</button>
                    <button className="btn primary" onClick={() => grade(true)}>외웠어요</button>
                  </div>
                </React.Fragment>
              )}
            </div>
          </React.Fragment>
        );
      }

      if (!total) {
        return <div className="empty">아직 오답이 없습니다.{"\n"}영작 문항을 AI 채점하면 교정 내용이 여기에 쌓입니다.</div>;
      }
      return (
        <React.Fragment>
          <div className="section-label mono">오답 노트 · {total}개</div>
          <button className="btn primary studybtn" onClick={start} disabled={!duePool.length}>
            ✎ 오답 복습 · {duePool.length}개
          </button>
          <div className="toolbar">
            {CHIPS.map((c) => (
              <button key={c.id} className={"chip" + (filter === c.id ? " active" : "")} onClick={() => setFilter(c.id)}>{c.label}</button>
            ))}
          </div>
          {Object.keys(byCat).length === 0
            ? <div className="empty">조건에 맞는 오답이 없습니다.</div>
            : Object.entries(byCat).map(([cat, items]) => (
              <div className="errgroup" key={cat}>
                <div className="errgroup-h mono">{cat} · {items.length}</div>
                {items.map((e) => (
                  <div className="errrow" key={e.id}>
                    <div className="errrow-body">
                      <div><span className="errbefore-sm">{e.before}</span> <span className="garrow">→</span> <span className="errafter-sm">{e.after}</span></div>
                      {e.why && <div className="errwhy-sm">{e.why}</div>}
                    </div>
                    <div className="errrow-side">
                      <span className={"stagenote" + (e.stage === "mastered" ? " done" : "")}>
                        {e.stage === "mastered" ? "완료" : e.stage === "review" ? "1/2" : "복습"}
                      </span>
                      <button className="errdel" onClick={() => removeError(e.id)} aria-label="삭제" title="삭제">×</button>
                    </div>
                  </div>
                ))}
              </div>
            ))}
        </React.Fragment>
      );
    }

    function Wordbank({ wordbank, setWordbank, streak, session, showToast, onActivity }) {
      const [query, setQuery] = useState("");
      const [filter, setFilter] = useState("all"); // all | new | review | mastered
      const [flipped, setFlipped] = useState({});
      const [studying, setStudying] = useState(false);
      const [studyLabel, setStudyLabel] = useState("단어 외우기"); // heading shown during a study session
      const [deckSource, setDeckSource] = useState([]); // unshuffled cards for the active session, so "처음부터 다시" replays the same set
      const [deck, setDeck] = useState([]);
      const [idx, setIdx] = useState(0);
      const [cardFlip, setCardFlip] = useState(false);
      const [missed, setMissed] = useState([]);
      const [history, setHistory] = useState([]); // for undoing an accidental swipe
      const [showHelp, setShowHelp] = useState(false); // usage tips behind a "?" button
      const [confirmClearAll, setConfirmClearAll] = useState(false);
      const [showCal, setShowCal] = useState(false);
      const [calMonth, setCalMonth] = useState(() => kstToday().slice(0, 7));
      const [dragX, setDragX] = useState(0);
      const [fly, setFly] = useState(null); // the answered card, animating away
      const swipeRef = useRef({ down: false, startX: 0, dx: 0, moved: false });
      const today = kstToday();

      // Confetti pieces for the "다 외우셨네요!" celebration (generated once).
      const confetti = useMemo(() => {
        const colors = ["#df8b25", "#3f7d5a", "#4285F4", "#EA4335", "#FBBC05", "#b23b3b"];
        return Array.from({ length: 70 }, (_, i) => ({
          left: Math.random() * 100,
          delay: Math.random() * 0.7,
          dur: 1.8 + Math.random() * 1.6,
          size: 6 + Math.random() * 7,
          color: colors[i % colors.length],
        }));
      }, []);

      const isDue = (v) => reviewDue(v, today);

      // Soft-deleted words (a delete write with a fresh updatedAt, kept as a
      // tombstone) must be excluded from every view — grid, counts, and study
      // pools — so they never show up, even though the raw wordbank object
      // still contains them until garbage-collected.
      const entries = useMemo(() => {
        return Object.entries(wordbank)
          .filter(([, v]) => v && !v.deleted)
          .map(([word, v]) => ({ word, ...v, stage: stageOf(v) }))
          .filter((e) => {
            if (filter !== "all" && e.stage !== filter) return false;
            if (query && !e.word.includes(query.toLowerCase()) &&
                !(e.meaning || "").toLowerCase().includes(query.toLowerCase())) return false;
            return true;
          })
          .sort((a, b) => (b.addedDate || "").localeCompare(a.addedDate || "") || a.word.localeCompare(b.word));
      }, [wordbank, query, filter, today]);

      const aliveWords = useMemo(() => Object.entries(wordbank).filter(([, v]) => v && !v.deleted), [wordbank]);
      const total = aliveWords.length;
      const counts = { new: 0, review: 0, mastered: 0 };
      aliveWords.forEach(([, v]) => { counts[stageOf(v)]++; });
      const filterLabel = { new: "미암기", review: "복습중", mastered: "완료" }[filter] || "전체";

      // Study pool = 미암기(new) words; review pool = 복습중 words that are now due.
      // Each card carries its own `stage`, so a mixed-stage deck (e.g. the
      // filter-driven "학습하기" session below) can advance each word
      // correctly without a single global mode.
      const toCard = (word, v) => ({ word, meaning: v.meaning, pos: v.pos || null, example: v.example || "", meaningKo: v.meaningKo || "", stage: stageOf(v) });
      const reviewPool = useMemo(
        () => aliveWords.filter(([, v]) => isDue(v)).map(([word, v]) => toCard(word, v)),
        [aliveWords, today]
      );
      const newPool = useMemo(
        () => aliveWords.filter(([, v]) => stageOf(v) === "new").map(([word, v]) => toCard(word, v)),
        [aliveWords]
      );
      // Filter-driven pool: whatever the 전체/미암기/복습중/완료 chip (+ search)
      // currently shows, studyable as-is — including 완료, which otherwise had
      // no way to be reviewed again except resetting one word at a time.
      const filteredPool = useMemo(
        () => entries.map((e) => ({ word: e.word, meaning: e.meaning, pos: e.pos || null, example: e.example || "", meaningKo: e.meaningKo || "", stage: e.stage })),
        [entries]
      );

      const patch = (word, p, ev) => {
        ev && ev.stopPropagation();
        setWordbank((prev) => ({ ...prev, [word]: { ...prev[word], ...p, updatedAt: Date.now() } }));
      };
      // Soft-delete: keep the entry but mark it deleted with a fresh
      // updatedAt, instead of removing the key outright. A hard delete has no
      // timestamp to win a merge with, so cross-device sync (last-write-wins
      // by updatedAt) would just pull the old copy back from the server on the
      // very next sync. Deleted entries are filtered out of every view above
      // and garbage-collected after they're old enough (see the load sweep).
      const removeWord = (word, ev) => {
        ev.stopPropagation();
        if (!window.confirm(`"${word}" 단어를 단어장에서 삭제할까요?`)) return;
        setWordbank((prev) => (prev[word] ? { ...prev, [word]: { ...prev[word], deleted: true, updatedAt: Date.now() } } : prev));
      };
      // Delete only what's currently shown (respects the stage filter/search),
      // e.g. tapping 완료 then deleting removes only 완료 words, not everything.
      const clearFiltered = () => {
        const ids = entries.map((e) => e.word);
        setWordbank((prev) => {
          const next = { ...prev };
          for (const id of ids) if (next[id]) next[id] = { ...next[id], deleted: true, updatedAt: Date.now() };
          return next;
        });
        setConfirmClearAll(false);
        if (showToast) showToast(`${ids.length}개 단어를 삭제했어요`);
      };
      // 완료(장기완료) 단어를 다시 복습중으로 되돌린다.
      const backToReview = (word, ev) => {
        ev && ev.stopPropagation();
        setWordbank((prev) => prev[word]
          ? { ...prev, [word]: { ...prev[word], stage: "review", reviewSince: today, masteredSince: undefined, learned: true, updatedAt: Date.now() } }
          : prev);
        if (showToast) showToast(`"${word}" 다시 복습중으로 옮겼어요`);
      };
      const flip = (word) => setFlipped((p) => ({ ...p, [word]: !p[word] }));

      // Flashcard study: random order, meaning first, tap to flip to the word.
      // An answer is applied 160ms later, from inside the swipe animation's
      // timeout. Reading `deck[idx]` out of that render's closure graded the
      // WRONG card whenever a second answer slipped in before React re-rendered:
      // both answers saw the same idx, so one word was graded twice and the next
      // was skipped entirely — swiping briskly through ten words left several of
      // them still 미암기. These refs are read at fire time instead, and
      // `advance` moves the index immediately rather than waiting for the
      // re-render, so every card is graded exactly once however fast the user is.
      const deckRef = useRef([]);
      const idxRef = useRef(0);
      deckRef.current = deck;
      idxRef.current = idx;

      const shuffle = (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      };
      const startStudy = (pool, label) => {
        if (!pool.length) return;
        const cards = pool.map((e) => ({ word: e.word, meaning: e.meaning, pos: e.pos || null, example: e.example || "", meaningKo: e.meaningKo || "", stage: e.stage }));
        setStudyLabel(label); setDeckSource(cards);
        idxRef.current = 0; setFly(null);
        setDeck(shuffle(cards)); setIdx(0); setCardFlip(false); setMissed([]); setHistory([]); setStudying(true);
      };
      // Speak whichever side of a card is showing: the word, or its English
      // definition. (Both English; the Korean gloss stays a visual peek.)
      const speakVisible = (c, showWord) => { if (c) speak(showWord ? c.word : c.meaning, "en-US"); };
      // Each flip pronounces the side now shown; speak() cancels any prior audio.
      const flipCard = () => { const nf = !cardFlip; setCardFlip(nf); speakVisible(deck[idx], nf); };
      const advance = () => { stopSpeech(); setCardFlip(false); idxRef.current += 1; setIdx((i) => i + 1); };
      // "알아요" → advance one SRS stage, and mark today's word-learned streak.
      //   미암기 → 복습중.   복습중 → 장기완료.   장기완료 → stays 완료 (just a
      //   refresh; the deck mixes stages now that study sessions can be
      //   started from any filter chip, so each card advances off its own
      //   stage instead of a single session-wide mode).
      const know = () => {
        const cur = deckRef.current[idxRef.current];
        if (!cur) return;
        const w = cur.word;
        setHistory((h) => [...h, { word: w, prevEntry: wordbank[w], addedToMissed: false }]);
        if (cur.stage === "mastered") patch(w, { masteredSince: today });
        else if (cur.stage === "review") patch(w, { stage: "mastered", masteredSince: today, reviewSince: undefined });
        else patch(w, { stage: "review", reviewSince: today, learned: true });
        if (onActivity) onActivity(); // marking a word 외웠음 is the only thing that bumps the streak
        advance();
      };
      // "몰라요" → keep the stage, just repeat this round, EXCEPT a 완료 word
      // being forgotten drops it back into 복습중 (same as the per-card "다시
      // 외우기" button) so it re-enters the review cycle. Does NOT count
      // toward the streak (only actually memorizing a word does). A 복습중
      // word answered wrong keeps its reviewSince, so it simply stays due in
      // 복습하기 rather than being demoted back to 미암기.
      const dontKnow = () => {
        const cur = deckRef.current[idxRef.current];
        if (!cur) return;
        const w = cur.word;
        const wasIn = missed.includes(w);
        setHistory((h) => [...h, { word: w, prevEntry: wordbank[w], addedToMissed: !wasIn }]);
        setMissed((m) => (wasIn ? m : [...m, w]));
        if (cur.stage === "mastered") patch(w, { stage: "review", reviewSince: today, masteredSince: undefined });
        advance();
      };
      // Undo the last swipe: step back a card and revert its SRS change.
      const undo = () => {
        if (!history.length) return;
        stopSpeech();
        const last = history[history.length - 1];
        setHistory((h) => h.slice(0, -1));
        setWordbank((prev) => {
          const n = { ...prev };
          if (last.prevEntry) n[last.word] = last.prevEntry; else delete n[last.word];
          return n;
        });
        if (last.addedToMissed) setMissed((m) => m.filter((x) => x !== last.word));
        idxRef.current = Math.max(0, idxRef.current - 1);
        setIdx((i) => Math.max(0, i - 1));
        setCardFlip(false); setDragX(0); setFly(null);
      };
      const restartMissed = () => {
        stopSpeech();
        const d = shuffle(missed.map((w) => {
          const v = wordbank[w] || {};
          return { word: w, meaning: v.meaning || "", pos: v.pos || null, example: v.example || "", meaningKo: v.meaningKo || "", stage: stageOf(v) };
        }));
        idxRef.current = 0; setFly(null);
        setDeck(d); setMissed([]); setHistory([]); setIdx(0); setCardFlip(false);
      };

      // Backfill a missing example, Korean gloss, AND part-of-speech tag for
      // the current study card via /api/define — covers words added before
      // pos existed, so a long-press still shows the Korean meaning instantly
      // and the POS badge fills in as each word comes up in study.
      useEffect(() => {
        if (!studying || idx >= deck.length) return;
        const cur = deck[idx];
        if (!cur || (cur.example && cur.meaningKo && cur.pos)) return;
        const endpoint = (window.DBW_CONFIG || {}).DEFINE_ENDPOINT;
        if (!endpoint) return;
        let cancelled = false;
        (async () => {
          try {
            const r = await fetch(endpoint, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ word: cur.word, passage: "" }),
            });
            if (!r.ok) return;
            const d = await r.json();
            if (cancelled) return;
            const patch = {};
            if (d.example && !cur.example) patch.example = d.example;
            if (d.ko && !cur.meaningKo) patch.meaningKo = d.ko;
            if (d.pos && !cur.pos) patch.pos = d.pos;
            if (!Object.keys(patch).length) return;
            setDeck((dk) => dk.map((it, i) => (i === idx ? { ...it, ...patch } : it)));
            setWordbank((prev) => (prev[cur.word] ? { ...prev, [cur.word]: { ...prev[cur.word], ...patch } } : prev));
          } catch (e) {}
        })();
        return () => { cancelled = true; };
      }, [studying, idx, deck]);

      // Swipe: drag the card left (몰라요) / right (알아요); a small move is a tap (flip).
      // Press-and-hold (꾸욱) peeks the Korean meaning while held.
      const SWIPE_TH = 80;
      const LONG_MS = 420;
      const [koPeek, setKoPeek] = useState(false);
      const longTimer = useRef(null);
      const clearLong = () => { if (longTimer.current) { clearTimeout(longTimer.current); longTimer.current = null; } };
      const onCardDown = (e) => {
        swipeRef.current = { down: true, startX: e.clientX, dx: 0, moved: false, long: false };
        clearLong();
        longTimer.current = setTimeout(() => { swipeRef.current.long = true; setKoPeek(true); }, LONG_MS);
      };
      const onCardMove = (e) => {
        if (!swipeRef.current.down) return;
        const dx = e.clientX - swipeRef.current.startX;
        swipeRef.current.dx = dx;
        if (Math.abs(dx) > 6) { swipeRef.current.moved = true; clearLong(); }
        if (!swipeRef.current.long) setDragX(dx);
      };
      // The answer is applied IMMEDIATELY and the next card is live under the
      // user's finger straight away; the card that was answered flies out as a
      // separate, non-interactive ghost.
      //
      // It used to be the real card that flew: the answer waited 160ms inside a
      // timeout while the card itself was translated 520px off to the side. A
      // user swiping at any pace faster than that found the next swipe landing
      // on empty space — the card wasn't under their finger any more — so the
      // gesture was simply lost and that word stayed 미암기. Ten brisk swipes
      // graded four words. Nothing waits on an animation now.
      const flyKey = useRef(0);
      const answerSwipe = (dir) => {
        const cur = deckRef.current[idxRef.current];
        if (!cur) return; // deck already finished
        stopSpeech(); // moving to the next card stops any playing pronunciation
        setFly({ card: cur, dir, flipped: cardFlip, from: dragX, key: ++flyKey.current });
        setDragX(0);
        if (dir === "no") dontKnow(); else know();
      };
      // The ghost is purely decorative; dropping it late is harmless, and a
      // fresh answer replaces it outright.
      useEffect(() => {
        if (!fly) return;
        const t = setTimeout(() => setFly((f) => (f && f.key === fly.key ? null : f)), 220);
        return () => clearTimeout(t);
      }, [fly]);
      const onCardUp = () => {
        const { dx, moved, long } = swipeRef.current;
        const wasDown = swipeRef.current.down;
        swipeRef.current.down = false;
        clearLong();
        if (!wasDown) return; // press didn't start on the card (e.g. the 🔊 button) → ignore
        if (long) { setKoPeek(false); setDragX(0); return; } // was a long-press peek
        if (dx <= -SWIPE_TH) answerSwipe("no");
        else if (dx >= SWIPE_TH) answerSwipe("yes");
        else { if (!moved) flipCard(); setDragX(0); }
      };

      // Keyboard on PC: ← = 몰라요, → = 알아요 (same as swiping); Space/↑/↓ flips.
      // A ref keeps the handler reading the latest state without re-binding.
      const keyRef = useRef({});
      keyRef.current = { active: studying && idx < deck.length, answerSwipe, flipCard, setKoPeek };
      useEffect(() => {
        const isTyping = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
        const onKey = (e) => {
          const k = keyRef.current;
          if (!k.active || isTyping(e.target)) return;
          // e.repeat: a held arrow key auto-repeats; one press = one answer.
          if (e.key === "ArrowLeft") { e.preventDefault(); if (!e.repeat) k.answerSwipe("no"); }
          else if (e.key === "ArrowRight") { e.preventDefault(); if (!e.repeat) k.answerSwipe("yes"); }
          else if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); k.flipCard(); }
          else if (e.key === "Enter") { e.preventDefault(); k.setKoPeek(true); } // hold Enter = Korean 뜻 peek
        };
        const onKeyUp = (e) => {
          const k = keyRef.current;
          if (e.key === "Enter") k.setKoPeek(false);
        };
        window.addEventListener("keydown", onKey);
        window.addEventListener("keyup", onKeyUp);
        return () => { window.removeEventListener("keydown", onKey); window.removeEventListener("keyup", onKeyUp); };
      }, []);

      const CHIPS = [
        { id: "all", label: `전체 ${total}` },
        { id: "new", label: `미암기 ${counts.new}` },
        { id: "review", label: `복습중 ${counts.review}` },
        { id: "mastered", label: `완료 ${counts.mastered}` },
      ];

      // Grid cards show status only — memorizing/reviewing happens in the
      // 단어 외우기 / 복습하기 sessions, not per word.
      const actionFor = (e) => {
        if (e.stage === "new") return <span className="stagenote">미암기</span>;
        if (e.stage === "review") {
          if (isDue(e)) return <span className="stagenote due">복습 가능</span>;
          const d = Math.max(1, REVIEW_DUE_DAYS - daysBetween(e.reviewSince || today, today));
          return <span className="stagenote">복습 D-{d}</span>;
        }
        return <button className="restudybtn" onClick={(ev) => backToReview(e.word, ev)}>다시 외우기</button>;
      };

      // The wordbank is per-account: when a backend is configured but the user
      // isn't signed in, show only the login prompt — no words, streak, or study.
      if (SB && !session) {
        return (
          <div className="loginprompt">
            <div className="loginprompt-title fraunces">로그인해 주세요</div>
            <div className="loginprompt-desc">단어장은 계정마다 다릅니다. 로그인하면 외운 단어를 PC·모바일 어디서나 볼 수 있어요.</div>
            <GoogleButton onClick={() => googleSignIn(showToast)} className="wide" />
          </div>
        );
      }

      // Flashcard study session (replaces the grid while active).
      if (studying) {
        // Round finished → summary + repeat-missed / restart.
        if (idx >= deck.length) {
          const known = deck.length - missed.length;
          return (
            <React.Fragment>
              <div className="studyhead mono">
                <button className="chip" onClick={undo} disabled={!history.length} title="방금 넘긴 카드로 돌아가기">← 되돌리기</button>
                <span>라운드 완료</span>
                <button className="chip" onClick={() => { stopSpeech(); setStudying(false); }}>닫기 ✕</button>
              </div>
              <div className="studydone">
                <div className="donestats">
                  <div className="donestat">
                    <div className="num fraunces">{known}</div>
                    <div className="lbl mono">외운 단어</div>
                  </div>
                  <div className="donestat">
                    <div className="num fraunces">{missed.length}</div>
                    <div className="lbl mono">학습 중인 단어</div>
                  </div>
                </div>
                {missed.length > 0
                  ? <button className="btn primary" onClick={restartMissed}>학습 중인 단어 {missed.length}개 다시</button>
                  : (
                    <React.Fragment>
                      <div className="doneperfect fraunces">다 외우셨네요! 🎉</div>
                      <div className="confetti" aria-hidden="true">
                        {confetti.map((c, i) => (
                          <span key={i} style={{
                            left: c.left + "%", width: c.size, height: c.size, background: c.color,
                            animationDelay: c.delay + "s", animationDuration: c.dur + "s",
                          }} />
                        ))}
                      </div>
                    </React.Fragment>
                  )}
                <button className="btn ghost" onClick={() => startStudy(deckSource, studyLabel)}>처음부터 다시</button>
                <button className="btn ghost" onClick={() => { stopSpeech(); setStudying(false); }}>단어장으로</button>
              </div>
            </React.Fragment>
          );
        }
        const cur = deck[idx];
        return (
          <React.Fragment>
            <div className="studyhead mono">
              <button className="chip" onClick={undo} disabled={!history.length} title="방금 넘긴 카드로 돌아가기">← 되돌리기</button>
              <span>{studyLabel} · {idx + 1} / {deck.length}</span>
              <button className="chip" onClick={() => { stopSpeech(); setStudying(false); }}>닫기 ✕</button>
            </div>
            <div className="fcstage">
            {fly && (
              <div key={fly.key} className={"flashcard flying " + fly.dir + (fly.flipped ? " flipped" : "")}
                style={{ "--fc-from": `${fly.from}px`, "--fc-to": fly.dir === "no" ? "-520px" : "520px",
                         "--fc-rot": fly.dir === "no" ? "-21deg" : "21deg" }} aria-hidden="true">
                {fly.flipped
                  ? <div className="fc-word fraunces">{fly.card.word}</div>
                  : <div className="fc-def">{fly.card.meaning}</div>}
              </div>
            )}
            {/* Keyed by index so each card mounts fresh at rest. Without it the
                element survived from the previous card and animated back from
                wherever the finger let go — for those ~180ms it sat off to the
                side, and a swipe started in that window landed on empty space
                and was silently dropped, leaving that word unmarked. */}
            <div key={"card-" + idx}
              className={"flashcard" + (cardFlip ? " flipped" : "") + (dragX > SWIPE_TH ? " yes" : dragX < -SWIPE_TH ? " no" : "")}
              style={{ transform: `translateX(${dragX}px) rotate(${dragX * 0.04}deg)`, transition: swipeRef.current.down ? "none" : "transform .18s ease" }}
              onPointerDown={onCardDown} onPointerMove={onCardMove} onPointerUp={onCardUp} onPointerCancel={onCardUp}>
              <span className="swipe-tag no" style={{ opacity: dragX < 0 ? Math.min(1, -dragX / SWIPE_TH) : 0 }}>✕ 몰라요</span>
              <span className="swipe-tag yes" style={{ opacity: dragX > 0 ? Math.min(1, dragX / SWIPE_TH) : 0 }}>알아요 ✓</span>
              <button className="fc-speak" onPointerDown={(ev) => ev.stopPropagation()} onClick={(ev) => { ev.stopPropagation(); speakVisible(cur, cardFlip); }} title="발음 듣기">🔊</button>
              {cardFlip
                ? <React.Fragment>
                    {cur.pos && <span className="poschip">{POS_KO[cur.pos] || cur.pos}</span>}
                    <div className="fc-word fraunces">{cur.word}</div>
                    {cur.example && <div className="fc-ex">{cur.example}</div>}
                  </React.Fragment>
                : <div className="fc-def">{cur.meaning}</div>}
              <div className="fc-hint mono">{cardFlip ? "탭하면 뜻으로" : "탭하면 단어 보기"}</div>
              {koPeek && (
                <div className="fc-ko">
                  <div className="fc-ko-word fraunces">{cur.word}</div>
                  <div className="fc-ko-mean fraunces">{cur.meaningKo || "불러오는 중…"}</div>
                  <div className="fc-ko-tag mono">한국어 뜻</div>
                </div>
              )}
            </div>
            </div>
            <div className="fc-help">
              <button className={"fc-help-btn" + (showHelp ? " open" : "")} onClick={() => setShowHelp((h) => !h)}>
                <span className="fc-help-ic">ⓘ</span> 사용법 <span className="fc-help-caret">{showHelp ? "▴" : "▾"}</span>
              </button>
              {showHelp && (
                <div className="fc-help-panel">
                  <div className="fc-help-row">
                    <span className="fc-help-key">←</span> 몰라요
                    <span className="fc-help-sep">·</span>
                    <span className="fc-help-key">→</span> 알아요
                    <span className="fc-help-sep">·</span>
                    탭하면 뒤집기
                    <span className="fc-help-sep">·</span>
                    꾸욱 누르면 한국어 뜻
                  </div>
                  <div className="fc-help-row">
                    <span className="fc-help-badge">PC 키보드</span>
                    <span className="fc-help-key">←</span> 몰라요
                    <span className="fc-help-sep">·</span>
                    <span className="fc-help-key">→</span> 알아요
                    <span className="fc-help-sep">·</span>
                    <span className="fc-help-key">Space</span> 뒤집기
                    <span className="fc-help-sep">·</span>
                    <span className="fc-help-key">Enter</span> 한국어 뜻
                  </div>
                </div>
              )}
            </div>
          </React.Fragment>
        );
      }

      return (
        <React.Fragment>
          <div className="streak">
            <button
              className="streaktext-btn"
              onClick={() => { setCalMonth(kstToday().slice(0, 7)); setShowCal(true); }}
              title="학습 캘린더 보기"
            >
              <div className="streaktext">🔥 {streak.count || 0}일 연속 학습 중</div>
              <span className="streakhint">탭하면 캘린더 보기</span>
            </button>
            <div style={{ textAlign: "right" }}>
              <div className="big fraunces">{counts.mastered}/{total}</div>
              <div className="lbl mono">장기완료 / 전체</div>
            </div>
          </div>

          {showCal && (
            <div className="sheet-backdrop" onClick={() => setShowCal(false)}>
              <div className="sheet calsheet" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-grip" />
                <div className="cal-head">
                  <button className="cal-navbtn" onClick={() => setCalMonth((m) => shiftMonth(m, -1))} aria-label="이전 달">‹</button>
                  <div className="cal-title fraunces">{Number(calMonth.slice(0, 4))}년 {Number(calMonth.slice(5, 7))}월</div>
                  <button className="cal-navbtn" onClick={() => setCalMonth((m) => shiftMonth(m, 1))} aria-label="다음 달">›</button>
                </div>
                <div className="cal-dow">
                  {["일", "월", "화", "수", "목", "금", "토"].map((d) => <span key={d}>{d}</span>)}
                </div>
                <div className="calgrid">
                  {monthDays(calMonth).map((d, i) => {
                    const learned = d && (streak.days || []).includes(d);
                    return (
                      <div key={i} className={"calcell" + (!d ? " empty" : "") + (d === today ? " today" : "") + (learned ? " fire" : "")}>
                        {d && <span className="caldate">{Number(d.slice(-2))}</span>}
                        {learned && <span className="calfire">🔥</span>}
                      </div>
                    );
                  })}
                </div>
                <div className="cal-total mono">지금까지 총 {(streak.days || []).length}일 단어를 외웠어요</div>
                <button className="btn ghost" onClick={() => setShowCal(false)}>닫기</button>
              </div>
            </div>
          )}

          {total > 0 && (
            <React.Fragment>
              <button className="btn primary studybtn" onClick={() => startStudy(newPool, "단어 외우기")} disabled={!newPool.length}>
                🎴 단어 외우기 · 미암기 {newPool.length}개
              </button>
              <button className="btn ghost studybtn" onClick={() => startStudy(reviewPool, "복습하기")} disabled={!reviewPool.length}>
                🔁 복습하기 · 오늘 복습 가능 {reviewPool.length}개
              </button>
            </React.Fragment>
          )}

          <div className="toolbar">
            <input className="search" placeholder="단어·뜻 검색" value={query} onChange={(e) => setQuery(e.target.value)} />
            {CHIPS.map((c) => (
              <button key={c.id} className={"chip" + (filter === c.id ? " active" : "")} onClick={() => setFilter(c.id)}>{c.label}</button>
            ))}
          </div>

          {entries.length > 0 && (
            <button className="btn ghost studybtn" onClick={() => startStudy(filteredPool, `${filterLabel} 학습`)}>
              🎴 {filterLabel} 학습하기 · {entries.length}개
            </button>
          )}

          {entries.length > 0 && (
            <button className="clearallbtn" onClick={() => setConfirmClearAll(true)}>
              {filter === "all" && !query ? "단어장 전체 삭제" : `${filterLabel} 삭제`}
            </button>
          )}

          {confirmClearAll && (
            <div className="sheet-backdrop" onClick={() => setConfirmClearAll(false)}>
              <div className="sheet" onClick={(e) => e.stopPropagation()}>
                <div className="sheet-grip" />
                <div className="sheet-title fraunces">
                  {filter === "all" && !query ? "단어장을 전체 삭제할까요?" : `${filterLabel} 단어를 삭제할까요?`}
                </div>
                <div className="sheet-desc">
                  {filter === "all" && !query
                    ? `모은 단어 ${total}개와 학습 진행 상황이 모두 삭제됩니다. 되돌릴 수 없어요.`
                    : `현재 목록에 보이는 ${entries.length}개 단어만 삭제됩니다 (${filterLabel}). 되돌릴 수 없어요.`}
                </div>
                <div className="sheet-actions">
                  <button className="btn ghost" onClick={() => setConfirmClearAll(false)}>취소</button>
                  <button className="btn danger" onClick={clearFiltered}>삭제</button>
                </div>
              </div>
            </div>
          )}

          {entries.length === 0 ? (
            <div className="empty">
              {total === 0
                ? "아직 모은 단어가 없습니다.\n기사를 읽고 모르는 단어를 탭해 보세요."
                : "조건에 맞는 단어가 없습니다."}
            </div>
          ) : (
            <div className="wgrid">
              {entries.map((e) => (
                <div key={e.word} className={"wcard " + e.stage} onClick={() => { const showWord = !flipped[e.word]; flip(e.word); speakVisible(e, showWord); }}>
                  <button className="wdelete" onClick={(ev) => removeWord(e.word, ev)} aria-label="삭제" title="삭제">×</button>
                  <button className="wspeak" onClick={(ev) => { ev.stopPropagation(); speakVisible(e, !!flipped[e.word]); }} aria-label="발음 듣기" title="발음 듣기">🔊</button>
                  <div className="cardbody">
                    {e.pos && <span className="poschip">{POS_KO[e.pos] || e.pos}</span>}
                    {flipped[e.word]
                      ? <div className="front fraunces">{e.word}</div>
                      : <div className="backdef">{e.meaning}</div>}
                  </div>
                  <div className="meta">
                    <span>{e.addedDate || ""}</span>
                    {actionFor(e)}
                  </div>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
