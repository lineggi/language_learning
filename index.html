<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf7" />
  <title>Daybreak Wire</title>

  <!-- Favicon + home-screen icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Fonts: headline=Fraunces, body=Newsreader (serif), data/labels=IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Pretendard: Korean glyphs render in this; it sits AFTER the Latin fonts in
       each stack, so English keeps its serif/mono design and only Korean changes. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- React 18 + Babel standalone (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Pinned to 7.x: Babel 8 defaults preset-react to the automatic JSX runtime,
       which emits `import {jsx} from "react/jsx-runtime"` and breaks a non-module
       inline script (blank page). 7.23.5 uses the classic runtime (React.createElement). -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <!-- Supabase client (cross-device sync) + app config. Both are optional: with
       an empty SUPABASE_URL the app runs local-only, exactly as before. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <!-- Pure state logic (streak / SRS / sync merges), shared with the Node test suite. -->
  <script src="lib/state.js"></script>

  <style>
    :root {
      --amber: #df8b25;
      --amber-soft: #f6e3c7;
      --bg: #fbfaf7;
      --card: #ffffff;
      --ink: #23201b;
      --muted: #6b6459;
      --faint: #9a9284;
      --hair: #e6e1d6;
      --good: #3f7d5a;
      --shadow: 0 1px 0 rgba(35,32,27,.04), 0 8px 24px rgba(35,32,27,.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: "Newsreader", "Pretendard", Georgia, serif;
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: "IBM Plex Mono", "Pretendard", ui-monospace, monospace; }
    .fraunces { font-family: "Fraunces", "Pretendard", Georgia, serif; }

    #root { max-width: 640px; margin: 0 auto; min-height: 100vh; }

    /* Masthead */
    .masthead {
      padding: 22px 20px 14px;
      border-bottom: 1px solid var(--hair);
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(1.1) blur(8px);
    }
    .masthead .kicker {
      font-family: "IBM Plex Mono", "Pretendard", monospace;
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--faint);
      display: flex; justify-content: space-between; align-items: center;
    }
    .masthead h1 {
      font-family: "Fraunces", "Pretendard", serif;
      font-weight: 700; font-size: 30px; letter-spacing: -.01em;
      margin: 6px 0 0;
    }
    .masthead .amberdot { color: var(--amber); }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      padding: 10px 16px 0;
      position: sticky; top: 0; z-index: 15;
    }
    .tabbar {
      position: sticky; bottom: 0; z-index: 20;
      display: flex; gap: 2px;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--hair);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    }
    .tabbar button {
      flex: 1; background: none; border: 0; cursor: pointer;
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); padding: 8px 4px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .tabbar button.active { color: var(--ink); background: var(--amber-soft); }
    .tabbar .glyph { font-size: 16px; }

    main { padding: 16px 16px 24px; }

    /* Recommendation cards */
    .section-label {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
      margin: 8px 2px 12px;
    }
    .cat-label {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 12px;
      letter-spacing: .1em; color: var(--amber); margin: 18px 2px 10px;
    }
    .cat-label:first-of-type { margin-top: 4px; }
    .rec {
      background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
      padding: 16px 16px 14px; margin-bottom: 12px; box-shadow: var(--shadow);
      cursor: pointer; transition: transform .12s ease, border-color .12s ease;
      display: block; width: 100%; text-align: left;
    }
    .rec:active { transform: scale(.992); }
    .rec .rank {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-weight: 600; font-size: 12px;
      color: var(--amber); letter-spacing: .1em;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .rec .rank .badge {
      background: var(--amber); color: #fff; border-radius: 6px;
      padding: 2px 7px; font-size: 12px;
    }
    .rec .reads { color: var(--faint); }
    .rec h2 {
      font-family: "Fraunces", "Pretendard", serif; font-weight: 600; font-size: 22px;
      line-height: 1.25; margin: 10px 0 6px; letter-spacing: -.01em;
    }
    .rec .hook { color: var(--muted); font-size: 16px; line-height: 1.5; }
    .rec .foot {
      margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; color: var(--faint);
    }
    .rec .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--hair); }
    .rec.read { opacity: .82; }
    .readpill {
      background: var(--amber-soft); color: #8a5a12; border-radius: 999px;
      padding: 2px 9px; font-size: 10px; letter-spacing: .1em;
    }

    /* Reader */
    .backbtn {
      background: none; border: 0; cursor: pointer; color: var(--muted);
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 12px; letter-spacing: .08em;
      padding: 4px 0; margin-bottom: 8px;
    }
    .holdnote {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; color: var(--amber);
      letter-spacing: .06em; height: 16px; margin: 2px 0 6px;
    }
    .reader h2 {
      font-family: "Fraunces", "Pretendard", serif; font-weight: 700; font-size: 26px;
      line-height: 1.22; margin: 6px 0 4px; letter-spacing: -.01em;
    }
    .reader .byline {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; color: var(--faint);
      letter-spacing: .08em; margin-bottom: 16px;
    }
    .passage { font-size: 19px; line-height: 1.75; }
    .passage .w { cursor: pointer; border-radius: 3px; padding: 0 .5px; user-select: none; -webkit-user-select: none; }
    .passage .w.picked {
      background: linear-gradient(transparent 62%, var(--amber-soft) 62%);
      box-shadow: inset 0 -2px 0 var(--amber);
    }
    /* Study mode: a small number before each sentence; tap it to see the
       Korean translation (and the sentence's glossary words) below. */
    .passage.study .sentence { border-radius: 4px; transition: background .12s; }
    .passage.study .sentence.open { background: #fdf4e4; }
    .passage.study .phl {
      background: linear-gradient(transparent 62%, var(--amber-soft) 62%);
      box-shadow: inset 0 -2px 0 var(--amber);
    }
    .passage.study .snum {
      display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center;
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; font-weight: 600;
      color: #fff; background: var(--amber); border-radius: 5px; cursor: pointer;
      margin: 0 4px 0 0; vertical-align: 2px; user-select: none; padding: 0 3px;
    }
    .passage.study .snum:hover { background: #c9781a; }
    .passage.study .sbko {
      display: block; font-family: "Newsreader", "Pretendard", serif; font-size: 16px;
      color: var(--ink); line-height: 1.55; margin-bottom: 6px;
    }
    .passage.study .sentbox {
      display: block; margin: 8px 0 12px; padding: 10px 12px;
      background: #fff8ee; border-left: 3px solid var(--amber); border-radius: 8px;
      font-family: "Newsreader", "Pretendard", serif; font-size: 15px; line-height: 1.5;
    }
    .passage.study .sbrow { display: block; padding: 4px 0; cursor: pointer; }
    .passage.study .sbrow b { color: var(--ink); }
    .passage.study .sbrow.muted { color: var(--faint); cursor: default; }
    .passage.study .sbadd {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 10px;
      color: var(--amber); border: 1px solid var(--amber-soft); border-radius: 999px; padding: 1px 6px; margin-left: 4px;
    }
    .hint {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; color: var(--faint);
      letter-spacing: .04em; margin: 14px 0; text-align: center;
    }
    .finishbtn {
      width: 100%; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--amber); color: #fff;
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-weight: 600; font-size: 13px;
      letter-spacing: .06em; text-transform: uppercase; padding: 15px;
      margin: 4px 0 28px;
    }
    .finishbtn:active { opacity: .88; }

    .divider { height: 1px; background: var(--hair); margin: 22px 0; }

    .btn {
      width: 100%; border: 0; border-radius: 12px; cursor: pointer;
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-weight: 600; font-size: 13px;
      letter-spacing: .06em; text-transform: uppercase; padding: 14px;
    }
    .btn.primary { background: var(--amber); color: #fff; }
    .btn.primary:disabled { background: var(--hair); color: var(--faint); cursor: not-allowed; }
    .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--hair); }

    /* Glossary */
    .glosslist { list-style: none; padding: 0; margin: 12px 0 0; }
    .glossitem {
      display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
      padding: 11px 2px; border-bottom: 1px solid var(--hair);
    }
    .glossitem .term { font-weight: 600; }
    .glossitem .base { color: var(--faint); font-size: 13px; }
    .glossitem .def { color: var(--muted); text-align: right; font-size: 16px; }
    .glossitem .saved { color: var(--good); font-size: 10px; font-family: "IBM Plex Mono", "Pretendard", monospace; }

    /* Writing */
    .qcard {
      background: var(--card); border: 1px solid var(--hair); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
    }
    .qcard .qlabel {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 12px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--amber); margin-bottom: 8px;
    }
    .qcard .qtext { font-size: 19px; line-height: 1.55; margin-bottom: 12px; }
    .qcard .frames { margin-bottom: 12px; }
    .qcard .frames-label { font-size: 10px; color: var(--faint); letter-spacing: .08em; margin-bottom: 6px; }
    .qcard .frames-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .qcard .frame-chip {
      border: 1px dashed var(--amber-soft); background: #fffaf1; color: #8a5a12; cursor: pointer;
      border-radius: 8px; padding: 5px 9px; font-family: "Newsreader", "Pretendard", serif;
      font-size: 13px; font-style: italic; line-height: 1.3;
    }
    .qcard .frame-chip:hover { background: var(--amber-soft); }
    .qcard textarea {
      width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--hair);
      border-radius: 10px; padding: 12px; font-family: "Newsreader", "Pretendard", serif; font-size: 18px;
      background: #fffdf9; color: var(--ink);
    }
    .qcard textarea:focus { outline: none; border-color: var(--amber); }
    .model {
      margin-top: 10px; padding: 10px 12px; background: #f6f4ee; border-radius: 10px;
      font-size: 15px; line-height: 1.5;
    }
    .model .mlabel {
      font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--good); margin-bottom: 4px;
    }

    /* AI grade result */
    .grade {
      margin-top: 10px; padding: 12px; border: 1px solid var(--amber-soft);
      background: #fffaf1; border-radius: 10px;
    }
    .grade .gtop {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
      padding-bottom: 10px; border-bottom: 1px solid var(--hair);
    }
    .grade .gscore {
      font-family: "Fraunces", "Pretendard", serif; font-weight: 700; font-size: 38px;
      color: var(--amber); line-height: 1;
    }
    .grade .gscore-unit { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
    .grade .gsum { font-size: 15px; color: var(--ink); line-height: 1.5; margin-bottom: 8px; }
    .grade .gcorr { padding: 7px 0; border-top: 1px dashed var(--hair); font-size: 15px; }
    .grade .gbefore { color: #b23b3b; text-decoration: line-through; }
    .grade .garrow { color: var(--faint); }
    .grade .gafter { color: var(--good); font-weight: 600; }
    .grade .gwhy { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .grade .grevised { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair); font-size: 15px; line-height: 1.55; }
    .grade .grevised .mono { font-size: 10px; color: var(--good); letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
    /* Overall assessment (총평) */
    .overall {
      margin-top: 16px; padding: 18px 16px; border: 1px solid var(--amber-soft);
      background: #fffaf1; border-radius: 14px;
    }
    .overall-title { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .overall-loading { color: var(--muted); font-size: 13px; }
    .overall-body { font-size: 15px; line-height: 1.65; color: var(--ink); }
    .overall-sec { margin-top: 14px; }
    .overall-h {
      font-size: 11px; letter-spacing: .1em; color: #8a5a12; font-weight: 600;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .overall-sec ul { margin: 0; padding-left: 18px; }
    .overall-sec li { font-size: 14px; line-height: 1.6; color: var(--ink); margin-bottom: 4px; }
    /* 문법 미니 드릴 */
    .drillbox {
      border: 1px solid var(--amber-soft); background: #fffaf1; border-radius: 14px; padding: 16px;
    }
    .drill-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .drill-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .drill-head { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-bottom: 10px; }
    .drill-sentence { font-family: "Newsreader", "Pretendard", serif; font-size: 19px; line-height: 1.6; color: var(--ink); }
    .drill-blank { color: var(--amber); font-weight: 700; border-bottom: 2px solid var(--amber); padding: 0 4px; }
    .drill-hint { font-size: 11px; color: var(--faint); margin-top: 8px; }
    .drill-input {
      width: 100%; border: 1px solid var(--hair); border-radius: 10px; padding: 11px; margin: 12px 0 10px;
      font-family: "Newsreader", "Pretendard", serif; font-size: 18px; background: #fff; color: var(--ink);
    }
    .drill-verdict { font-family: "IBM Plex Mono","Pretendard",monospace; font-size: 13px; margin: 4px 0 10px; }
    .drill-verdict.good { color: var(--good); }
    .drill-verdict.bad { color: #b23b3b; }
    /* 오답 노트 */
    .errcard {
      background: var(--card); border: 1px solid var(--hair); border-radius: 16px;
      padding: 18px 16px; box-shadow: var(--shadow); position: relative;
    }
    .errcard .errcat {
      display: inline-block; background: var(--amber-soft); color: #8a5a12; border-radius: 999px;
      padding: 3px 10px; font-size: 10px; font-weight: 600; letter-spacing: .06em; margin-bottom: 12px;
    }
    .errcard .errq, .errcard .errask { font-size: 10px; color: var(--faint); letter-spacing: .08em; margin-bottom: 4px; }
    .errcard .errask { margin-top: 14px; }
    .errcard .errbefore {
      font-family: "Newsreader", "Pretendard", serif; font-size: 18px; color: #b23b3b;
      text-decoration: line-through; line-height: 1.5;
    }
    .errcard .errinput {
      width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--hair);
      border-radius: 10px; padding: 11px; font-family: "Newsreader", "Pretendard", serif; font-size: 18px;
      background: #fffdf9; color: var(--ink); margin-bottom: 10px;
    }
    .errcard .mcloading { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .errcard .mcchoices { display: flex; flex-direction: column; gap: 8px; }
    .errcard .mcopt {
      width: 100%; text-align: left; border: 1px solid var(--hair); background: #fffdf9;
      border-radius: 10px; padding: 11px 13px; cursor: pointer;
      font-family: "Newsreader", "Pretendard", serif; font-size: 16px; color: var(--ink); line-height: 1.4;
    }
    .errcard .mcopt:hover:not(:disabled) { border-color: var(--amber); background: #fff8ec; }
    .errcard .mcopt:disabled { cursor: default; opacity: .55; }
    .errcard .mcopt.correct { opacity: 1; border-color: var(--good); background: #eef6f0; color: var(--good); font-weight: 600; }
    .errcard .mcopt.wrong { opacity: 1; border-color: #b23b3b; background: #fdecec; color: #b23b3b; text-decoration: line-through; }
    .errcard .errverdict { font-family: "IBM Plex Mono","Pretendard",monospace; font-size: 12px; margin: 6px 0 8px; }
    .errcard .errverdict.good { color: var(--good); }
    .errcard .errverdict.bad { color: #b23b3b; }
    .errcard .errafter {
      font-family: "Newsreader", "Pretendard", serif; font-size: 18px; color: var(--good); font-weight: 600; line-height: 1.5;
    }
    .errcard .errafter .mono { font-size: 10px; color: var(--good); letter-spacing: .1em; text-transform: uppercase; margin-right: 6px; }
    .errcard .errwhy { font-size: 13px; color: var(--muted); line-height: 1.55; margin-top: 8px; }
    .errcard .errbtns { display: flex; gap: 10px; margin-top: 14px; }
    .errcard .errbtns .btn { flex: 1; width: auto; }
    .errgroup { margin-top: 14px; }
    .errgroup-h { font-size: 11px; color: #8a5a12; font-weight: 600; letter-spacing: .06em; margin-bottom: 6px; }
    .errrow {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px;
      border-bottom: 1px solid var(--hair);
    }
    .errrow-body { flex: 1; min-width: 0; font-size: 15px; line-height: 1.5; }
    .errrow .errbefore-sm { color: #b23b3b; text-decoration: line-through; }
    .errrow .errafter-sm { color: var(--good); font-weight: 600; }
    .errrow .errwhy-sm { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .errrow-side { display: flex; align-items: center; gap: 6px; flex: none; }
    .errrow .errdel { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
    .errrow .errdel:hover { color: #b23b3b; background: var(--hair); }
    .gerr { margin-top: 8px; color: #b23b3b; font-size: 12px; }

    /* Auth / sync bar */
    .authbar {
      display: flex; align-items: center; gap: 8px; margin: 0 0 14px;
      padding: 8px 10px; border: 1px solid var(--hair); border-radius: 10px; background: var(--card);
    }
    .authbar .mono { font-family: "IBM Plex Mono", "Pretendard", monospace; font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .authbar .authinput {
      flex: 1; min-width: 0; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px;
      font-size: 12px; background: #fffdf9; color: var(--ink);
    }
    .authbar .authinput:focus { outline: none; border-color: var(--amber); }
    .authbar .authbtn {
      border: 1px solid var(--hair); background: var(--amber-soft); color: #8a5a12; cursor: pointer;
      border-radius: 8px; padding: 8px 12px; font-family: "IBM Plex Mono", "Pretendard", monospace;
      font-size: 11px; white-space: nowrap;
    }
    .authbar .authbtn.google { background: #fff; color: #3c4043; border-color: #dadce0; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .authbar .authbtn.google .gicon { width: 15px; height: 15px; display: block; }
    /* Login prompt shown in the wordbank when signed out */
    .loginprompt {
      border: 1px solid var(--amber-soft); background: #fffaf1; border-radius: 14px;
      padding: 18px 16px; margin-bottom: 14px; text-align: center;
    }
    .loginprompt-title { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .loginprompt-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
    .loginprompt .authbtn.google {

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ------------------------------------------------------------------ */
    /* Storage helpers (localStorage, prefix dbw:)                         */
    /* ------------------------------------------------------------------ */
    const KEY = { wordbank: "dbw:wordbank", reads: "dbw:reads", streak: "dbw:streak", picks: "dbw:picks", writing: "dbw:writing", errors: "dbw:errors" };

    /* Optional backend: Supabase (sync) + /api/grade (AI grading). If SUPABASE_URL
       is empty the client is null and the app stays fully local. */
    const CFG = (typeof window !== "undefined" && window.DBW_CONFIG) || {};
    const SB = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
      ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
              // Implicit flow returns tokens in the URL hash on redirect, which a
              // pure static SPA can read directly — avoids PKCE code-exchange
              // failures that leave OAuth logins stuck on the sign-in state.
              flowType: "implicit",

      : null;

    /* Pure state logic lives in lib/state.js so `npm test` can exercise the
       rules that historically broke here — streak decay, wordbank stage
       transitions and the cross-device merges — against the very same code
       this page runs. */
    const {
      kstToday, daysBetween, monthDays, shiftMonth,
      REVIEW_DUE_DAYS, stageOf, reviewDue, classifyWord,
      normalizeStreak, pickStreak, bumpStreak,
      mergeWordbank, mergeReads, mergeErrors, mergeWriting,
      TOMBSTONE_TTL_MS, sweepTombstones,
      candidateForms, glossVal, lookupGloss, normText, POS_KO,
    } = window.DBW;

    // Speak an English word/phrase aloud via the browser's Web Speech API (TTS).
    // The Web Speech default voice differs per OS (macOS may pick a male or
    // low-quality novelty voice, while iOS/Windows default to a female one), so
    // we explicitly choose a female English voice for a consistent sound. Known
    // male/novelty voices are avoided when no preferred name is present.
    let _enVoice = null;
    const FEMALE_EN = [
      "Samantha", "Google US English", "Microsoft Zira", "Microsoft Aria", "Microsoft Jenny",
      "Karen", "Moira", "Tessa", "Victoria", "Fiona", "Serena", "Allison", "Susan",
      "Ava", "Google UK English Female", "Zira",
    ];
    const MALE_OR_NOVELTY = /david|mark|guy|fred|alex|daniel|thomas|oliver|arthur|george|aaron|albert|male|jorge|diego|rishi|junior|ralph|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|pipe|trinoids|whisper|wobble|zarvox|organ|superstar/i;
    function pickEnVoice() {
      try {
        const synth = window.speechSynthesis;
        const voices = (synth && synth.getVoices && synth.getVoices()) || [];
        if (!voices.length) return null;
        const en = voices.filter((v) => /^en(-|_|$)/i.test(v.lang) || /english/i.test(v.name));
        if (!en.length) return null;
        for (const name of FEMALE_EN) {
          const hit = en.find((v) => v.name === name) || en.find((v) => v.name.toLowerCase().includes(name.toLowerCase()));
          if (hit) return hit;
        }
        return en.find((v) => !MALE_OR_NOVELTY.test(v.name)) || en[0];
      } catch (e) { return null; }
    }
    function refreshEnVoice() { const v = pickEnVoice(); if (v) _enVoice = v; }
    try {
      if (window.speechSynthesis) {
        refreshEnVoice();
        window.speechSynthesis.onvoiceschanged = refreshEnVoice; // voices load async in some browsers
      }
    } catch (e) {}
    function applyVoice(u, lang) {
      // Only override for English; leave other languages to their platform voice.
      if ((lang || "en-US").toLowerCase().indexOf("en") === 0) {
        const v = _enVoice || pickEnVoice();
        if (v) u.voice = v;
      }
    }

    function speak(text, lang) {
      try {
        const synth = window.speechSynthesis;
        if (!synth || !text) return;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang = lang || "en-US";
        applyVoice(u, u.lang);
        u.rate = lang === "ko-KR" ? 1.0 : 0.95;
        synth.speak(u);
      } catch (e) {}
    }
    // Speak a sequence of {text, lang} parts back-to-back (word → then meaning),
    // queueing utterances so they play in order without cutting each other off.
    function speakSeq(parts) {
      try {
        const synth = window.speechSynthesis;
        if (!synth) return;
        synth.cancel();
        (parts || []).forEach((p) => {
          if (!p || !p.text) return;
          const u = new SpeechSynthesisUtterance(String(p.text));
          u.lang = p.lang || "en-US";
          applyVoice(u, u.lang);
          u.rate = p.lang === "ko-KR" ? 1.0 : 0.95;
          synth.speak(u);
        });
      } catch (e) {}
    }
    // Pronounce the word's English definition (the meaning shown on the front
    // of the card). The Korean gloss stays a visual-only long-press peek.
    function speakCard(c) {
      if (c && c.meaning) speak(c.meaning, "en-US");
    }
    // Stop any pronunciation currently playing (used when flipping/advancing).
    function stopSpeech() {
      try { const s = window.speechSynthesis; if (s) s.cancel(); } catch (e) {}
    }

    function load(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    }
    function save(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }


    /* ------------------------------------------------------------------ */
    /* App root                                                            */
    /* ------------------------------------------------------------------ */
    function App() {
      const [packs, setPacks] = useState(null);
      const [err, setErr] = useState(null);
      const [tab, setTab] = useState("today");
      const [openId, setOpenId] = useState(null);
      // packs.json only carries the recent window (see build_packs.js). The
      // rest of the feed is reached through a small index, fetched the first
      // time 보관함 is opened, plus per-month shards fetched only when an old
      // article is actually opened. Older builds shipped one flat packs.json,
      // so both are optional: if they 404 the app simply shows what it has.
      const [archIndex, setArchIndex] = useState(null); // entry[] | "error" | null
      const [shards, setShards] = useState({});         // "YYYY-MM" -> pack[] | "error"

      // Normalize keys on load so any pre-existing case-variant duplicates
      // (e.g. "Vanguard" and "vanguard") collapse into one right away.
      const [wordbank, setWordbank] = useState(() => mergeWordbank(load(KEY.wordbank, {}), {}));
      const [reads, setReads] = useState(() => load(KEY.reads, {}));
      const [streak, setStreak] = useState(() => load(KEY.streak, { count: 0, lastDate: null, days: [] }));
      const [errors, setErrors] = useState(() => load(KEY.errors, {})); // 오답 노트 (grammar SRS)
      // 영작 답안 + AI 채점 결과, keyed by pack id. Held here rather than read
      // straight from localStorage inside <Writing> so it takes part in the
      // same pull/merge/push cycle as everything else — otherwise switching
      // devices silently loses every answer the learner wrote.
      const [writing, setWriting] = useState(() => load(KEY.writing, {}));
      const [toast, setToast] = useState(null);
      const [session, setSession] = useState(null);
      const [syncMsg, setSyncMsg] = useState("");
      // Reactive (not a ref) so flipping it reliably retriggers the push
      // effect below in the correct order — a ref flip doesn't itself cause
      // any effect to re-run, which could otherwise race a post-pull repair
      // push against the flag not yet being set.
      const [hydrated, setHydrated] = useState(false);
      const saveTimer = useRef(null);

      useEffect(() => save(KEY.wordbank, wordbank), [wordbank]);
      useEffect(() => save(KEY.reads, reads), [reads]);
      useEffect(() => save(KEY.streak, streak), [streak]);
      useEffect(() => save(KEY.errors, errors), [errors]);
      useEffect(() => save(KEY.writing, writing), [writing]);

      // If a day was missed (no word marked 외웠음 yesterday or today), the
      // streak is broken — reflect that as 0 right away instead of waiting
      // for the next word, so a stale count is never shown after opening the
      // app post-gap.
      useEffect(() => { setStreak((prev) => normalizeStreak(prev)); }, []);

      // Track Supabase auth session (only when a backend is configured).
      useEffect(() => {
        if (!SB) return;
        // Surface an OAuth redirect error (e.g. redirect_uri_mismatch) if present.
        const params = new URLSearchParams(
          (window.location.hash || "").replace(/^#/, "") + "&" + (window.location.search || "").replace(/^\?/, "")
        );
        const err = params.get("error_description") || params.get("error");
        if (err) setSyncMsg("로그인 오류: " + err);
        SB.auth.getSession().then(({ data }) => setSession(data.session || null));
        // Only an explicit SIGNED_OUT clears the session. A transient null on a
        // token-refresh hiccup would otherwise bounce the user to the login
        // screen even though their stored refresh token is still valid.
        const { data: sub } = SB.auth.onAuthStateChange((event, s) => {
          if (event === "SIGNED_OUT") { setSession(null); return; }
          if (s) setSession(s);
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      // Pull the remote row and merge it into local state (last-write-wins).
      // Returns nothing; setState uses the same reference when unchanged so it
      // doesn't cause a needless push.
      const pullRemote = useCallback(async () => {
        if (!SB || !session) return;
        const { data, error } = await SB.from("user_state").select("*")
          .eq("user_id", session.user.id).maybeSingle();
        if (error || !data) return;
        const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
        setWordbank((loc) => { const m = mergeWordbank(loc, data.wordbank); return same(m, loc) ? loc : m; });
        setReads((loc) => { const m = mergeReads(loc, data.reads); return same(m, loc) ? loc : m; });
        setStreak((loc) => pickStreak(loc, data.streak));
        setErrors((loc) => { const m = mergeErrors(loc, data.errors); return same(m, loc) ? loc : m; });
        setWriting((loc) => { const m = mergeWriting(loc, data.writing); return same(m, loc) ? loc : m; });
      }, [session]);

      // On sign-in: pull + merge, then allow pushing. Flipping `hydrated`
      // (state, not a ref) is itself what wakes the push effect below, so a
      // post-pull repair push (e.g. a locally-corrected streak that the
      // stale server copy hasn't seen yet) reliably fires once, in order.
      useEffect(() => {
        if (!SB || !session) { setHydrated(false); return; }
        let cancelled = false;
        (async () => {
          setSyncMsg("동기화 중…");
          await pullRemote();
          if (cancelled) return;
          setHydrated(true);
          setSyncMsg("동기화됨");
          setTimeout(() => setSyncMsg(""), 1500);
        })();
        return () => { cancelled = true; };
      }, [session, pullRemote]);

      // Re-pull when the tab regains focus, so switching back to a device picks
      // up changes made on another device (no realtime channel needed).
      useEffect(() => {
        if (!SB || !session) return;
        const onVisible = () => { if (document.visibilityState === "visible" && hydrated) pullRemote(); };
        window.addEventListener("focus", onVisible);
        document.addEventListener("visibilitychange", onVisible);
        return () => {
          window.removeEventListener("focus", onVisible);
          document.removeEventListener("visibilitychange", onVisible);
        };
      }, [session, pullRemote, hydrated]);

      // Push local changes up (debounced) once hydrated. Read-merge-write so a
      // push never clobbers a newer per-word change made on another device.
      // `hydrated` flipping true after a pull is itself enough to trigger this
      // (even if wordbank/reads/streak didn't otherwise change), so a value
      // silently corrected during merge — like a decayed streak — gets written
      // back instead of only self-healing on the next unrelated edit.
      useEffect(() => {
        if (!SB || !session || !hydrated) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            const { data } = await SB.from("user_state").select("*")
              .eq("user_id", session.user.id).maybeSingle();
            const wb = data ? mergeWordbank(wordbank, data.wordbank) : wordbank;
            const rd = data ? mergeReads(reads, data.reads) : reads;
            const st = data ? pickStreak(streak, data.streak) : streak;
            const er = data ? mergeErrors(errors, data.errors) : errors;
            const wr = data ? mergeWriting(writing, data.writing) : writing;
            const { error } = await SB.from("user_state").upsert({
              user_id: session.user.id, wordbank: wb, reads: rd, streak: st,
              errors: er, writing: wr,
              updated_at: new Date().toISOString(),
            });
            if (error) { setSyncMsg("저장 오류"); return; }
            // Reflect the merged result locally (guarded so it can't loop).
            const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
            setWordbank((loc) => (same(wb, loc) ? loc : wb));
            setReads((loc) => (same(rd, loc) ? loc : rd));
            setStreak((loc) => (same(st, loc) ? loc : st));
            setErrors((loc) => (same(er, loc) ? loc : er));
            setWriting((loc) => (same(wr, loc) ? loc : wr));
          } catch (e) { setSyncMsg("저장 오류"); }
        }, 1200);
        return () => saveTimer.current && clearTimeout(saveTimer.current);
      }, [wordbank, reads, streak, errors, writing, session, hydrated]);

      // Once on load: permanently purge soft-deleted entries whose tombstone
      // is old enough to have safely propagated to every device (deletion has
      // already won any sync merge by then, so keeping the tombstone forever
      // would just grow the stored blob for no reason).
      //
      // Nothing else is swept. A word's stage only ever changes through an
      // explicit user action. Two time-based demotions used to live here and
      // both did the same damage — silently throwing away progress the user
      // had earned, then making the word climb the whole 미암기→복습중→완료
      // ladder again:
      //   · 완료 words were deleted outright 7 days after being mastered.
      //   · 복습중 words not reviewed within 7 days fell all the way back to
      //     미암기, so 단어 외우기 kept refilling with words already learned.
      // An overdue 복습중 word was never actually "stuck" — reviewDue() has no
      // upper bound, so it simply stays due in 복습하기 until it's reviewed,
      // which is where a lapsed word belongs.
      useEffect(() => {
        setWordbank((prev) => sweepTombstones(prev));
        setReads((prev) => sweepTombstones(prev));
        setErrors((prev) => sweepTombstones(prev));
        setWriting((prev) => sweepTombstones(prev));
      }, []);

      useEffect(() => {
        fetch("packs.json?t=" + Date.now())
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((arr) => setPacks(Array.isArray(arr) ? arr : []))
          .catch((e) => setErr(e.message));
      }, []);

      // Lazy: nothing is fetched until the user actually opens 보관함.
      useEffect(() => {
        if (tab !== "archive" || archIndex) return;
        let cancelled = false;
        fetch("archive/index.json?t=" + Date.now())
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((arr) => { if (!cancelled) setArchIndex(Array.isArray(arr) ? arr : "error"); })
          .catch(() => { if (!cancelled) setArchIndex("error"); });
        return () => { cancelled = true; };
      }, [tab, archIndex]);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 1800);
      }, []);

      // Sort ascending by date then rank; latest date group = today's picks.
      const sorted = useMemo(() => {
        if (!packs) return [];
        return [...packs].sort((a, b) => {
          if (a.date !== b.date) return a.date < b.date ? -1 : 1;
          return (a.rank || 99) - (b.rank || 99);
        });
      }, [packs]);

      const latestDate = sorted.length ? sorted[sorted.length - 1].date : null;
      const todaysPicks = sorted.filter((p) => p.date === latestDate);

      // Which monthly shard an id lives in. The index is authoritative; ids
      // embed their date ("cd-2026-08-01-1") so the fallback still works before
      // the index has loaded.
      const monthOf = useCallback((id) => {
        const row = Array.isArray(archIndex) && archIndex.find((e) => e.id === id);
        if (row && row.date) return row.date.slice(0, 7);
        const m = String(id || "").match(/(\d{4}-\d{2})-\d{2}/);
        return m ? m[1] : null;
      }, [archIndex]);

      const openPack = useMemo(() => {
        if (!openId) return null;
        const local = sorted.find((p) => p.id === openId || p.date === openId);
        if (local) return local;
        for (const list of Object.values(shards)) {
          if (!Array.isArray(list)) continue;
          const hit = list.find((p) => p.id === openId);
          if (hit) return hit;
        }
        return null;
      }, [openId, sorted, shards]);

      // Opening an archived article pulls in its month, once, and keeps it.
      // In-flight months are tracked in a ref rather than in `shards`: writing a
      // "loading" marker into state would change this effect's own dependency
      // and re-run it, abandoning the fetch it had just started.
      const openShard = openId && !openPack ? monthOf(openId) : null;
      const shardReq = useRef({});
      useEffect(() => {
        if (!openShard || shardReq.current[openShard]) return;
        shardReq.current[openShard] = true;
        // No cache-buster here: a shard is ~1MB and rarely changes, so a
        // conditional request that comes back 304 is far cheaper than
        // re-downloading it on every open. must-revalidate keeps it correct
        // while the newest shard is still growing (see vercel.json).
        fetch(`archive/${openShard}.json`)
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then((arr) => setShards((prev) => ({ ...prev, [openShard]: Array.isArray(arr) ? arr : "error" })))
          .catch(() => setShards((prev) => ({ ...prev, [openShard]: "error" })));
      }, [openShard]);

      // 보관함 rows: index entries (the whole history) topped up with the
      // recent window, so it works even when archive/index.json isn't there.
      const archiveRows = useMemo(() => {
        const rows = [];
        const seen = new Set();
        for (const p of sorted) { if (!seen.has(p.id)) { seen.add(p.id); rows.push(p); } }
        if (Array.isArray(archIndex)) {
          for (const e of archIndex) if (!seen.has(e.id)) { seen.add(e.id); rows.push(e); }
        }
        // Same ascending order <Archive> already expects (it reverses to show newest first).
        return rows.sort((a, b) => (a.date === b.date ? (a.rank || 99) - (b.rank || 99) : (a.date < b.date ? -1 : 1)));
      }, [sorted, archIndex]);

      const addWords = useCallback((entries, articleId) => {
        setWordbank((prev) => {
          const next = { ...prev };
          // Case-insensitive index so a word is never stored twice under
          // different casing/spacing (e.g. "Vanguard" vs "vanguard").
          const lcIndex = {};
          for (const k of Object.keys(next)) lcIndex[k.toLowerCase()] = k;
          for (const { base, def, pos, example } of entries) {
            const norm = String(base || "").toLowerCase().trim();
            if (!norm) continue;
            const existing = lcIndex[norm];
            const cur = existing ? next[existing] : null;
            // No entry, or the existing one was soft-deleted → (re)collect fresh.
            if (!cur || cur.deleted) {
              const key = existing || norm;
              next[key] = { meaning: def, pos: pos || null, addedDate: kstToday(), learned: false, articleId, example: example || "", updatedAt: Date.now() };
              lcIndex[norm] = key;
            } else if (stageOf(cur) === "mastered") {
              // Running into an already-완료 word again means it wasn't actually
              // remembered — send it back to 미암기 instead of leaving it
              // mastered (and never as a second, duplicate entry).
              next[existing] = {
                ...cur, stage: "new", learned: false, masteredSince: undefined, reviewSince: undefined,
                meaning: def || cur.meaning, pos: pos || cur.pos || null, example: cur.example || example || "", articleId, updatedAt: Date.now(),
              };
            } else if ((example && !cur.example) || (pos && !cur.pos)) {
              next[existing] = { ...cur, example: cur.example || example, pos: cur.pos || pos, updatedAt: Date.now() }; // backfill example/pos onto an existing word
            }
          }
          return next;
        });
      }, []);

      // Record that at least one word was marked 외웠음 (알아요) today, and
      // advance the day-streak. Called multiple times a day is a no-op after
      // the first — the streak only bumps once per new day, and only for
      // actually memorizing a word (not reading, writing, or 몰라요).
      const recordWordLearned = useCallback(() => {
        setStreak((prev) => bumpStreak(prev));
      }, []);

      // Save AI corrections into the 오답 노트 (deduped by before→after).
      const addErrors = useCallback((corrections, packId) => {
        setErrors((prev) => {
          const next = { ...prev };
          for (const c of corrections || []) {
            const before = String((c && c.before) || "").trim();
            const after = String((c && c.after) || "").trim();
            if (!before || !after || before.toLowerCase() === after.toLowerCase()) continue;
            const id = (before + "→" + after).toLowerCase().replace(/\s+/g, " ");
            if (next[id] && !next[id].deleted) continue; // already noted
            next[id] = {
              before, after, why: String((c && c.why) || "").trim(),
              category: String((c && c.category) || "기타").trim(),
              packId, addedDate: kstToday(), stage: "new", updatedAt: Date.now(),
            };
          }
          return next;
        });
      }, []);

      // Save (or clear) one article's 영작 answers. Clearing writes a
      // tombstone rather than dropping the key, so a stale copy on another
      // device can't resurrect answers the user deliberately reset.
      const saveWriting = useCallback((packId, entry) => {
        setWriting((prev) => {
          if (!entry) {
            if (!prev[packId] || prev[packId].deleted) return prev;
            return { ...prev, [packId]: { deleted: true, updatedAt: Date.now() } };
          }
          return { ...prev, [packId]: { ...entry, deleted: false, updatedAt: Date.now() } };
        });
      }, []);

      const markRead = useCallback((articleId) => {
        setReads((prev) => {
          if (prev[articleId] && !prev[articleId].deleted) return prev;
          return { ...prev, [articleId]: { readAt: Date.now(), completed: true, updatedAt: Date.now() } };
        });
        // Reading alone no longer bumps the streak — only memorizing a word does.
      }, []);

      if (err) return <Shell tab={tab} setTab={setTab}><div className="empty">packs.json을 불러오지 못했습니다.<br/>{err}</div></Shell>;
      if (!packs) return <Shell tab={tab} setTab={setTab}><div className="empty">불러오는 중…</div></Shell>;

      let body;
      if (openId && !openPack && shards[openShard] === "error") {
        body = <div className="empty">이 기사를 불러오지 못했습니다.<br/>
          <button className="btn" onClick={() => setOpenId(null)}>돌아가기</button></div>;
      } else if (openId && !openPack) {
        body = <div className="empty">기사를 불러오는 중…</div>;
      } else if (openPack) {
        body = <Reader
          pack={openPack}
          wordbank={wordbank}
          reads={reads}
          onBack={() => setOpenId(null)}
          onComplete={markRead}
          onAddWords={addWords}
          showToast={showToast}
          onAddErrors={addErrors}
          writing={writing}
          onSaveWriting={saveWriting}
        />;
      } else if (tab === "today") {
        body = <Today picks={todaysPicks} date={latestDate} reads={reads} onOpen={setOpenId} />;
      } else if (tab === "archive") {
        body = <Archive packs={archiveRows} reads={reads} setReads={setReads} onOpen={setOpenId}
                        loading={archIndex === null} />;
      } else if (tab === "errors") {
        body = <ErrorNotes errors={errors} setErrors={setErrors} showToast={showToast} />;
      } else {
        body = <Wordbank wordbank={wordbank} setWordbank={setWordbank} streak={streak} session={session} showToast={showToast} onActivity={recordWordLearned} />;
      }

      return (
        <Shell tab={tab} setTab={(t) => { setOpenId(null); setTab(t); }} hideChromeWhenReading={!!openPack}>
          {SB && <AuthBar session={session} syncMsg={syncMsg} showToast={showToast} />}
          {body}
          {toast && <div className="toast">{toast}</div>}
        </Shell>
      );
    }

    /* ------------------------------------------------------------------ */
    /* AuthBar: magic-link login + sync status (only when SB configured)   */
    /* ------------------------------------------------------------------ */
    // A clean redirect target — no hash/query — so a leftover #access_token or
    // #error fragment from a previous (failed) attempt can't pollute the next
    // login and cause "OAuth state not found or expired".
    function cleanRedirect() { return window.location.origin + window.location.pathname; }
    async function googleSignIn(showToast) {
      if (!SB) return;
      const { error } = await SB.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: cleanRedirect() },
      });
      if (error && showToast) showToast("구글 로그인 실패: " + error.message);
    }
    // A reusable Google button (used in the auth bar and the wordbank prompt).
    function GoogleButton({ onClick, className }) {
      return (
        <button className={"authbtn google" + (className ? " " + className : "")} onClick={onClick} title="Google로 로그인">
          <svg className="gicon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          구글 로그인
        </button>
      );
    }

    function AuthBar({ session, syncMsg, showToast }) {
      const [email, setEmail] = useState("");
      const [sent, setSent] = useState(false);

      const sendLink = async () => {
        if (!email.trim()) return;
        const { error } = await SB.auth.signInWithOtp({
          email: email.trim(),
          options: { emailRedirectTo: cleanRedirect() },
        });
        if (error) showToast("로그인 링크 전송 실패: " + error.message);
        else { setSent(true); showToast("메일로 로그인 링크를 보냈어요"); }
      };

      const googleLogin = () => googleSignIn(showToast);

      if (session) {
        return (
          <div className="authbar">
            <span className="mono">☁ {session.user.email}{syncMsg ? " · " + syncMsg : " · 동기화 켜짐"}</span>
            <button className="authbtn" onClick={() => SB.auth.signOut()}>로그아웃</button>
          </div>
        );
      }
      return (
        <React.Fragment>
          <div className="authbar">
            <GoogleButton onClick={googleLogin} />
            <input className="authinput mono" type="email" placeholder="또는 이메일"
              value={email} onChange={(e) => setEmail(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && sendLink()} />
            <button className="authbtn" onClick={sendLink}>{sent ? "재전송" : "링크"}</button>
          </div>
          {syncMsg && <div className="authmsg mono">{syncMsg}</div>}
        </React.Fragment>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Shell: masthead + content + bottom tabbar                           */
    /* ------------------------------------------------------------------ */
    function Shell({ children, tab, setTab }) {
      const TABS = [
        { id: "today", label: "오늘", glyph: "◆" },
        { id: "archive", label: "보관함", glyph: "▤" },
        { id: "wordbank", label: "단어장", glyph: "✦" },
        { id: "errors", label: "오답노트", glyph: "✎" },
      ];
      return (
        <React.Fragment>
          <header className="masthead">
            <div className="kicker mono">
              <span>DAYBREAK WIRE</span>
              <span>{kstToday()} · KST</span>
            </div>
            <h1 className="fraunces">Daybreak <span className="amberdot">Wire</span></h1>
          </header>
          <main>{children}</main>
          <nav className="tabbar">
            {TABS.map((t) => (
              <button key={t.id} className={tab === t.id ? "active" : ""} onClick={() => setTab(t.id)}>
                <span className="glyph">{t.glyph}</span>
                <span>{t.label}</span>
              </button>
            ))}
          </nav>
        </React.Fragment>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Today: recommended 3                                                */
    /* ------------------------------------------------------------------ */
    function RecCard({ p, reads, onOpen, badge }) {
      const isRead = !!(reads[p.id] && !reads[p.id].deleted);
      return (
        <button className={"rec" + (isRead ? " read" : "")} onClick={() => onOpen(p.id)}>
          <div className="rank mono">
            <span className="badge">{badge}</span>
            <span className="reads">{p.reads || ""}</span>
          </div>
          <h2 className="fraunces">{p.title}</h2>
          <div className="hook">{p.hook}</div>
          <div className="foot mono">
            {p.url
              ? <a href={p.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()}>원문 ↗</a>
              : <span style={{ color: "var(--faint)" }}>원문 링크 없음</span>}
            {isRead ? <span className="readpill">READ</span> : <span>읽기 →</span>}
          </div>
        </button>
      );
    }

    function Today({ picks, date, reads, onOpen }) {
      const [cat, setCat] = useState("all"); // all | crypto | economy
      if (!picks.length) return <div className="empty">아직 추천 기사가 없습니다.<br/>Actions가 첫 팩을 생성하면 여기에 표시됩니다.</div>;
      const crypto = picks.filter((p) => p.category !== "economy");
      const econ = picks.filter((p) => p.category === "economy");
      const hasBoth = crypto.length > 0 && econ.length > 0;

      const Group = ({ items }) => items.map((p, i) => (
        <RecCard key={p.id} p={p} reads={reads} onOpen={onOpen} badge={String(i + 1).padStart(2, "0")} />
      ));

      const CHIPS = [
        { id: "all", label: `전체 ${picks.length}` },
        { id: "crypto", label: `크립토 ${crypto.length}` },
        { id: "economy", label: `경제 ${econ.length}` },
      ];

      return (
        <React.Fragment>
          <div className="section-label mono">오늘의 추천 · {date}</div>
          {hasBoth && (
            <div className="toolbar" style={{ marginBottom: "12px" }}>
              {CHIPS.map((c) => (
                <button key={c.id} className={"chip" + (cat === c.id ? " active" : "")} onClick={() => setCat(c.id)}>{c.label}</button>
              ))}
            </div>
          )}
          {!hasBoth ? (
            <Group items={crypto.length ? crypto : econ} />
          ) : cat === "all" ? (
            <React.Fragment>
              <div className="cat-label mono">◆ 크립토</div>
              <Group items={crypto} />
              <div className="cat-label mono">◆ 경제</div>
              <Group items={econ} />
            </React.Fragment>
          ) : (
            <Group items={cat === "crypto" ? crypto : econ} />
          )}
        </React.Fragment>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Reader: read gate → glossary → writing                              */
    /* ------------------------------------------------------------------ */
    function tokenize(text) {
      // Split into word / non-word tokens, keeping separators.
      return (text || "").split(/(\s+|[^\w'\-]+)/).filter((t) => t.length);
    }

    function Reader({ pack, wordbank, reads, onBack, onComplete, onAddWords, showToast, onAddErrors, writing, onSaveWriting }) {
      const alreadyRead = !!(reads[pack.id] && !reads[pack.id].deleted);
      // Restore any highlighted words for this article so they survive leaving
      // and re-opening the page (kept per pack id in localStorage).
      const [picked, setPicked] = useState(() => (load(KEY.picks, {})[pack.id]) || {}); // index -> word
      const [completed, setCompleted] = useState(alreadyRead);
      const [openSent, setOpenSent] = useState(null); // expanded sentence index (study mode)
      const savedRef = useRef(false);
      const doneRef = useRef(alreadyRead);

      const tokens = useMemo(() => tokenize(pack.passage), [pack.passage]);

      // Mark the article read (only via the 완독 button / click).
      const finish = useCallback(() => {
        if (doneRef.current) return;
        doneRef.current = true;
        setCompleted(true);
        onComplete(pack.id);
        window.scrollTo(0, 0);
      }, [onComplete, pack.id]);

      useEffect(() => {
        if (!alreadyRead) window.scrollTo(0, 0);
      }, [alreadyRead]);

      const togglePick = (idx, word) => {
        setPicked((prev) => {
          const next = { ...prev };
          if (next[idx]) delete next[idx]; else next[idx] = word;
          return next;
        });
      };

      // Mouse drag to highlight a run of consecutive words at once (desktop).
      // Uses MOUSE events, not pointer events, so touch swipes are never captured
      // for selection — on mobile a swipe just scrolls and a tap collects one word.
      const dragRef = useRef({ active: false, start: null, ranged: false });
      const selectRange = (a, b) => {
        const lo = Math.min(a, b), hi = Math.max(a, b);
        setPicked((prev) => {
          const next = { ...prev };
          for (let i = lo; i <= hi; i++) {
            const t = tokens[i];
            if (t && /^[\w'\-]+$/.test(t)) next[i] = t;
          }
          return next;
        });
      };
      // A word is toggled on mouseUP, not on a separate click event. The old
      // click-gated approach could be silently swallowed on desktop when a stray
      // hover/mouseenter during the press flipped a "moved" flag — leaving clicks
      // that did nothing. Deciding tap-vs-drag here makes a plain click reliable:
      // a real drag only counts once the pointer enters a DIFFERENT word.
      useEffect(() => {
        const up = () => { dragRef.current.active = false; };
        window.addEventListener("mouseup", up);
        return () => window.removeEventListener("mouseup", up);
      }, []);
      const onWordDown = (i) => { dragRef.current = { active: true, start: i, ranged: false }; };
      const onWordEnter = (i) => {
        const d = dragRef.current;
        if (d.active && i !== d.start) { d.ranged = true; selectRange(d.start, i); }
      };
      const onWordUp = (i, word) => {
        const d = dragRef.current;
        if (d.active && !d.ranged) togglePick(i, word); // a plain tap/click, not a drag
      };

      // Build glossary entries for the picked words (with lemma + wordbank fallback).
      const glossEntries = useMemo(() => {
        const out = [];
        const seen = new Set();
        Object.entries(picked).forEach(([idx, word]) => {
          const found = lookupGloss(word, pack.glossary, wordbank);
          const key = (found ? found.base : word.toLowerCase());
          if (seen.has(key)) return;
          seen.add(key);
          out.push({
            surface: word,
            base: found ? found.base : word.toLowerCase(),
            def: found ? found.def : null,
            pos: found ? found.pos : null,
            fromBank: found ? found.source === "bank" : false,
          });
        });
        return out.sort((a, b) => a.base.localeCompare(b.base));
      }, [picked, pack.glossary, wordbank]);

      // Split the passage into sentences, each with its tokens and the glossary
      // words it contains (with meanings) for the tap-to-reveal study mode.
      const sentences = useMemo(() => {
        const base = (Array.isArray(pack.sentences) && pack.sentences.length)
          ? pack.sentences.map((s) => ({ en: s.en || "", ko: s.ko || "" }))
          : ((pack.passage || "").match(/[^.!?]+[.!?]*(?:\s+|$)/g) || [pack.passage || ""])
              .filter((s) => s.trim()).map((s) => ({ en: s, ko: "" }));
        return base.map(({ en, ko }) => {
          const toks = tokenize(en);
          const glosses = [];
          const seen = new Set();
          toks.forEach((t) => {
            if (/^[\w'\-]+$/.test(t)) {
              const found = lookupGloss(t, pack.glossary, wordbank);
              if (found && found.def && !seen.has(found.base)) {
                seen.add(found.base);
                glosses.push({ surface: t, base: found.base, def: found.def, pos: found.pos });
              }
            }
          });
          return { en, ko, toks, glosses };
        });
      }, [pack.sentences, pack.passage, pack.glossary, wordbank]);

      // Words the reader highlighted while reading — kept highlighted in study mode.
      const pickedWords = useMemo(
        () => new Set(Object.values(picked).map((w) => w.toLowerCase())),
        [picked]
      );

      // The sentence in the passage that contains a word — used as its example.
      const sentenceContaining = (w) => {
        const esc = String(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const re = new RegExp("\\b" + esc + "\\b", "i");
        const hit = sentences.find((s) => re.test(s.en));
        return hit ? hit.en.trim() : "";
      };

      // On completion, save the tapped words into the wordbank (once). Words in
      // the article glossary use that meaning; any others are defined on demand
      // via /api/define so nothing is left as "사전에 없음". Each word also gets a
      // short example sentence (the passage sentence, or one from the API).
      useEffect(() => {
        if (!completed || savedRef.current) return;
        savedRef.current = true;
        (async () => {
          const withDef = glossEntries.filter((e) => e.def).map((e) => ({ base: e.base, def: e.def, pos: e.pos, example: sentenceContaining(e.surface) }));
          const noDef = glossEntries.filter((e) => !e.def);
          const endpoint = (window.DBW_CONFIG || {}).DEFINE_ENDPOINT;
          let fetched = [];
          if (noDef.length && endpoint) {
            const results = await Promise.all(noDef.map(async (e) => {
              try {
                const r = await fetch(endpoint, {
                  method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ word: e.surface, passage: pack.passage }),
                });
                if (!r.ok) return null;
                const d = await r.json();
                return d && d.meaning ? { base: (d.word || e.base), def: d.meaning, pos: d.pos || null, example: d.example || sentenceContaining(e.surface) } : null;
              } catch { return null; }
            }));
            fetched = results.filter(Boolean);
          }
          const all = [...withDef, ...fetched];
          if (all.length) {
            const cls = all.map((e) => classifyWord(wordbank, e.base));
            const newCount = cls.filter((c) => c === "new").length;
            const masteredCount = cls.filter((c) => c === "mastered").length;
            const existsCount = all.length - newCount - masteredCount;
            onAddWords(all, pack.id);
            if (!masteredCount && !existsCount) {
              showToast(all.length + "개 단어를 단어장에 담았어요");
            } else {
              const parts = [];
              if (newCount) parts.push(`${newCount}개 새로 담음`);
              if (masteredCount) parts.push(`${masteredCount}개는 다시 미암기로`);
              if (existsCount) parts.push(`${existsCount}개는 이미 있는 단어`);
              showToast(parts.join(" · "));
            }
          }
        })();
      }, [completed]);

      // Persist highlighted words per pack so they remain after navigating away.
      useEffect(() => {
        const all = load(KEY.picks, {});
        if (Object.keys(picked).length) all[pack.id] = picked;
        else delete all[pack.id];
        save(KEY.picks, all);
      }, [picked, pack.id]);

      const addOne = (g, ev) => {
        ev.stopPropagation();
        const cls = classifyWord(wordbank, g.base);
        onAddWords([{ base: g.base, def: g.def, pos: g.pos }], pack.id);
        if (cls === "mastered") showToast(`"${g.base}" 완료했던 단어예요 · 다시 미암기로 이동했어요`);
        else if (cls === "exists") showToast(`"${g.base}" 이미 단어장에 있는 단어예요`);
        else showToast(`"${g.base}" 단어장에 담았어요`);
      };

      const pickedCount = Object.keys(picked).length;

      return (
        <div className="reader">
          <button className="backbtn mono" onClick={onBack}>← 목록으로</button>
          <div className="holdnote mono">
            {completed ? "✓ 완독 · 문장을 탭하면 뜻이 보여요" : ""}
          </div>

          <h2 className="fraunces">{pack.title}</h2>
          <div className="byline mono">{pack.source} · {pack.date}</div>

          {!completed ? (
            <React.Fragment>
              <div className="passage">
                {tokens.map((tok, i) => {
                  if (/^[\w'\-]+$/.test(tok)) {
                    return (
                      <span key={i} className={"w" + (picked[i] ? " picked" : "")}
                        onMouseDown={() => onWordDown(i)}
                        onMouseEnter={() => onWordEnter(i)}
                        onMouseUp={() => onWordUp(i, tok)}>{tok}</span>
                    );
                  }
                  return <span key={i}>{tok}</span>;
                })}
              </div>
              <div className="hint mono">
                {pickedCount > 0 ? `${pickedCount}개 단어 선택됨` : "모르는 단어를 탭해서 표시 · PC는 드래그로 여러 개"}
              </div>
              <button className="finishbtn" onClick={finish}>완독 · 학습 시작</button>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="passage study">
                {sentences.map((s, si) => (
                  <span key={si} className={"sentence" + (openSent === si ? " open" : "")}>
                    <span className="snum" onClick={() => setOpenSent(openSent === si ? null : si)}
                          title="뜻 보기">{si + 1}</span>
                    {s.toks.map((t, ti) => (
                      /^[\w'\-]+$/.test(t) && pickedWords.has(t.toLowerCase())
                        ? <span key={ti} className="phl">{t}</span>
                        : <span key={ti}>{t}</span>
                    ))}
                    {openSent === si && (
                      <span className="sentbox">
                        {s.ko
                          ? <span className="sbko">{s.ko}</span>
                          : <span className="sbrow muted">번역은 다음 갱신부터 표시됩니다</span>}
                        {s.glosses.map((g, gi) => (
                          <span className="sbrow" key={gi} onClick={(ev) => addOne(g, ev)}>
                            {g.pos && <span className="poschip">{POS_KO[g.pos] || g.pos}</span>}
                            <b>{g.surface}</b> — {g.def} <span className="sbadd">+ 담기</span>
                          </span>
                        ))}
                      </span>
                    )}
                  </span>
                ))}
              </div>

              <div className="divider" />
              <Drill pack={pack} />
              <div className="divider" />
              <Writing key={pack.id} pack={pack} showToast={showToast} onAddErrors={onAddErrors}
                       saved={(writing || {})[pack.id]} onSave={onSaveWriting} />
            </React.Fragment>
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Grammar drill: verb/article/plural fill-in-the-blanks from the article */
    /* ------------------------------------------------------------------ */
    function Drill({ pack }) {
      const [items, setItems] = useState(null);
      const [loading, setLoading] = useState(false);
      const [errMsg, setErrMsg] = useState("");
      const [idx, setIdx] = useState(0);
      const [typed, setTyped] = useState("");
      const [revealed, setRevealed] = useState(false);
      const [right, setRight] = useState(0);
      const endpoint = (window.DBW_CONFIG || {}).DRILL_ENDPOINT || "/api/drill";

      const load = async () => {
        setLoading(true); setErrMsg("");
        try {
          const r = await fetch(endpoint, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ passage: pack.passage }),
          });
          const data = await r.json();
          if (r.ok && data && Array.isArray(data.items) && data.items.length) {
            setItems(data.items); setIdx(0); setTyped(""); setRevealed(false); setRight(0);
          } else setErrMsg((data && data.error) || "드릴을 불러오지 못했어요");
        } catch (e) { setErrMsg(String((e && e.message) || e)); }
        setLoading(false);
      };

      const cur = items && items[idx];
      const correct = revealed && cur && normText(typed) === normText(cur.answer);
      const next = () => {
        if (correct) setRight((n) => n + 1);
        setTyped(""); setRevealed(false); setIdx((i) => i + 1);
      };

      if (!items) {
        return (
          <div className="drillbox">
            <div className="drill-title fraunces">문법 미니 드릴</div>
            <div className="drill-desc">기사 문장으로 동사·관사·복수·전치사 빈칸 채우기 6문제.</div>
            <button className="btn ghost" onClick={load} disabled={loading}>{loading ? "만드는 중…" : "드릴 시작"}</button>
            {errMsg && <div className="gerr mono">{errMsg}</div>}
          </div>
        );
      }
      if (idx >= items.length) {
        return (
          <div className="drillbox">
            <div className="drill-title fraunces">드릴 완료 · {right} / {items.length}</div>
            <button className="btn ghost" onClick={load} disabled={loading}>{loading ? "만드는 중…" : "새 드릴"}</button>
          </div>
        );
      }
      const parts = cur.sentence.split("___");
      return (
        <div className="drillbox">
          <div className="drill-head mono">문법 드릴 · {idx + 1} / {items.length}</div>
          <div className="drill-sentence">
            {parts[0]}<span className="drill-blank">{revealed ? cur.answer : "____"}</span>{parts[1] || ""}
          </div>
          {cur.hint && <div className="drill-hint mono">힌트 · {cur.hint}</div>}
          {!revealed ? (
            <React.Fragment>
              <input className="drill-input" value={typed} placeholder="빈칸에 들어갈 단어"
                onChange={(e) => setTyped(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); setRevealed(true); } }} />
              <button className="btn primary" onClick={() => setRevealed(true)}>확인</button>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className={"drill-verdict " + (correct ? "good" : "bad")}>
                {correct ? "정답이에요 ✓" : `정답: ${cur.answer}`}
              </div>
              <button className="btn primary" onClick={next}>다음</button>
            </React.Fragment>
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Writing: 3 prompts, self-graded model answers                       */
    /* ------------------------------------------------------------------ */
    function Writing({ pack, showToast, onAddErrors, saved, onSave }) {
      const qs = pack.questions || [];
      const ans = pack.modelAnswers || [];
      const labels = ["Q1 · 사실확인", "Q2 · 문맥어휘", "Q3 · 의견"];
      // Sentence frames to scaffold an answer, by question type. Tap to insert.
      const FRAMES = [
        ["The main ~ is that ...", "According to the article, ...", "One key point is that ..."],
        ["In this context, ~ means ...", "Here, ~ refers to ...", "This is done through ..."],
        ["In my view, ...", "One benefit is ..., but one risk is ...", "I think ~ because ..."],
      ];
      // Restore any answers + AI feedback saved for this article so they survive
      // leaving and re-opening the page. The store lives in <App> (and syncs);
      // it is read once on mount so remote merges can't yank text out from
      // under someone mid-sentence. <Reader> keys this component by pack id,
      // so opening another article does re-read.
      const initRef = useRef(null);
      if (initRef.current === null) {
        const s = saved && !saved.deleted ? saved : {};
        initRef.current = s;
      }
      const stored = initRef.current;
      const [inputs, setInputs] = useState(() => qs.map((_, i) => (stored.inputs && stored.inputs[i]) || ""));
      const [revealed, setRevealed] = useState(() => !!stored.revealed);
      const [grades, setGrades] = useState(() => stored.grades || {}); // idx -> result | {error} | {skipped}
      const [grading, setGrading] = useState(false);
      const [confirmReset, setConfirmReset] = useState(false);
      const [overall, setOverall] = useState(() => stored.overall || null); // 총평 + 아이디어
      const [overallLoading, setOverallLoading] = useState(false);

      const endpoint = (window.DBW_CONFIG || {}).GRADE_ENDPOINT;
      const overallEndpoint = (window.DBW_CONFIG || {}).OVERALL_ENDPOINT || "/api/overall";

      // Persist answers + grades per pack so they aren't lost on navigation.
      // Skipped on the very first render so simply opening an article doesn't
      // stamp a fresh updatedAt on an untouched entry and beat a newer answer
      // written on another device.
      const dirty = useRef(false);
      useEffect(() => {
        if (!dirty.current) { dirty.current = true; return; }
        const hasContent = inputs.some((v) => v && v.trim()) || Object.keys(grades).length > 0 || revealed;
        onSave(pack.id, hasContent ? { inputs, grades, revealed, overall } : null);
      }, [inputs, grades, revealed, overall, pack.id, onSave]);

      const doReset = () => {
        setInputs(qs.map(() => ""));
        setGrades({});
        setRevealed(false);
        setOverall(null);
        setConfirmReset(false);
        onSave(pack.id, null);
        showToast("작성 내용을 지웠어요");
      };
      const hasWork = inputs.some((v) => v && v.trim()) || Object.keys(grades).length > 0;

      const copyMine = () => {
        const text = qs.map((q, i) => `Q${i + 1}. ${q}\nMy answer: ${inputs[i] || "(빈칸)"}`).join("\n\n");
        const payload = `다음 영작을 첨삭해 주세요.\n\n${text}`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(payload).then(
            () => showToast("내 답변을 복사했습니다"),
            () => showToast("복사 실패")
          );
        }
      };

      const gradeAll = async () => {
        if (!endpoint) { showToast("AI 채점 서버가 아직 설정되지 않았어요"); return; }
        if (!inputs.some((v) => v && v.trim())) { showToast("먼저 답을 작성해 주세요"); return; }
        setGrading(true); setRevealed(true);
        const acc = {};
        for (let i = 0; i < qs.length; i++) {
          const ua = (inputs[i] || "").trim();
          if (!ua) { acc[i] = { skipped: true }; setGrades({ ...acc }); continue; }
          try {
            const r = await fetch(endpoint, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question: qs[i], passage: pack.passage, modelAnswer: ans[i], userAnswer: ua }),
            });
            const data = await r.json();
            acc[i] = r.ok ? data : { error: data.error || ("HTTP " + r.status) };
            if (r.ok && data && onAddErrors) onAddErrors(data.corrections, pack.id); // save to 오답 노트
          } catch (e) { acc[i] = { error: String((e && e.message) || e) }; }
          setGrades({ ...acc });
        }
        setGrading(false);
        // Writing practice no longer bumps the streak — only memorizing a word does.
        fetchOverall(acc); // then build the overall 총평 across all answers
      };

      // Overall assessment (총평 + 개선 포인트 + 학습 아이디어) across the 3 answers.
      const fetchOverall = async (gradeMap) => {
        const gm = gradeMap || grades;
        const items = qs.map((q, i) => ({
          question: q,
          userAnswer: (inputs[i] || "").trim(),
          score: gm[i] && typeof gm[i].score === "number" ? gm[i].score : null,
          summary: gm[i] && gm[i].summary ? gm[i].summary : "",
        })).filter((it) => it.userAnswer);
        if (!items.length) return;
        setOverallLoading(true);
        try {
          const r = await fetch(overallEndpoint, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items }),
          });
          const data = await r.json();
          if (r.ok && data && data.overall) setOverall(data);
          else setOverall({ error: (data && data.error) || ("HTTP " + r.status) });
        } catch (e) {
          setOverall({ error: String((e && e.message) || e) });

              {g && !g.skipped && !g.error && (

                  <div className="mlabel mono">Model answer · 체크포인트</div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>

    function Archive({ packs, reads, setReads, onOpen, loading }) {
      // Only articles the user has finished reading, newest first.
      const rows = [...packs].reverse().filter((p) => reads[p.id] && !reads[p.id].deleted);
      if (!rows.length) {
        return loading
          ? <div className="empty">보관함을 불러오는 중…</div>
          : <div className="empty">아직 읽은 기사가 없습니다.{"\n"}오늘 탭에서 기사를 완독하면 여기에 쌓입니다.</div>;
      }
      // Soft-delete: keep the record but mark it deleted with a fresh
      // timestamp, so cross-device sync (last-write-wins) actually removes it
      // everywhere instead of a stale remote copy silently bringing it back.
      const removeRead = (id) => {
        setReads((prev) => (prev[id] ? { ...prev, [id]: { ...prev[id], deleted: true, updatedAt: Date.now() } } : prev));
      };
      return (
        <React.Fragment>
          <div className="section-label mono">보관함 · 읽은 기사 {rows.length}편</div>
          {rows.map((p) => (
            <div key={p.id} className="archrow">
              <button className="aopen" onClick={() => onOpen(p.id)}>
                <span className="adate mono">{p.date} #{p.rank || 1}</span>
                <span className="atitle fraunces">{p.title}</span>
                <span className="readpill">READ</span>
              </button>
              <button className="adelete" onClick={() => removeRead(p.id)}
                      aria-label="삭제" title="보관함에서 삭제">×</button>
            </div>
          ))}
        </React.Fragment>
      );
    }
